<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>damtol: damage tolerance workbench</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F9FA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#182028">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="damtol">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>:root {
  --paper: #E9EDF0;
  --panel: #F8F9FA;
  --sunk: #DEE3E8;
  --ink: #17212B;
  --muted: #56626E;
  --line: #C3CCD4;
  --crack: #B8262C;
  --primer: #5F7424;
  --steel: #2F5D7C;
  --amber: #9A5F0C;
  --ok: #2E7440;
  --bad: #B42318;
  --focus: #2F5D7C;
  --r-s: 3px;
  --r-m: 6px;
  --f: "Barlow", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --fc: "Barlow Semi Condensed", "Barlow", "Arial Narrow", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11171D; --panel: #182028; --sunk: #0D1217; --ink: #E3E8ED; --muted: #98A4B0;
    --line: #2C3843; --crack: #EF5A5F; --primer: #A2B85A; --steel: #7BB0D6; --amber: #E0A445;
    --ok: #62B57A; --bad: #F2685D; --focus: #7BB0D6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11171D; --panel: #182028; --sunk: #0D1217; --ink: #E3E8ED; --muted: #98A4B0;
  --line: #2C3843; --crack: #EF5A5F; --primer: #A2B85A; --steel: #7BB0D6; --amber: #E0A445;
  --ok: #62B57A; --bad: #F2685D; --focus: #7BB0D6; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.45;
  font-variant-numeric: tabular-nums; overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
img, svg { max-width: 100%; }
h1, h2, h3 { font-family: var(--fc); font-weight: 600; margin: 0; letter-spacing: 0.005em; }

/* ---------- start-up line (2.53.1): shown until the app has started, or with the reason it could not */
.bootmsg { padding: 10px 16px; background: var(--sunk); color: var(--ink); font-size: 14px; border-bottom: 1px solid var(--line); }
.bootmsg.bad { border-left: 4px solid var(--bad); white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- top bar */
.bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 20;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--fc); font-size: 22px; font-weight: 600; }
.brand span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .grow { display: none; }
/* 2.49.7: the brand takes the free space and its tagline is cut first, so the buttons stay on one row */
.bar .brand { flex: 1 1 0; min-width: 80px; overflow: hidden; }
.bar #presets { max-width: 200px; text-overflow: ellipsis; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.seg.mode button[aria-pressed="true"][data-v="compliance"] { background: var(--crack); color: #fff; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--r-m);
  padding: 6px 12px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
.btn.run { background: var(--crack); border-color: var(--crack); color: #fff; font-weight: 600; font-size: 16px; padding: 10px 16px; width: 100%; }
.btn.run[disabled] { opacity: 0.6; cursor: progress; }
.btn.small { padding: 2px 8px; font-size: 13px; }
.btn.ghost { background: transparent; }

/* ---------- layout */
.layout { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; min-height: calc(100vh - 56px); }
.inputs { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
.inputs .scroll { flex: 1; overflow-y: auto; padding: 6px 0 16px; }
.inputs .runbox { position: sticky; bottom: 0; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
.stale { color: var(--amber); font-size: 13px; margin-top: 6px; min-height: 18px; }
.results { padding: 20px 26px 60px; min-width: 0; }
/* Wide screens: inputs and results scroll on their own, so the results stay in view
   while the long input panel is scrolled. Screen only, so printing is unaffected. */
@media screen and (min-width: 861px) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .bar { flex: none; }
  .layout { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .inputs { min-height: 0; overflow: hidden; }
  .inputs .scroll { min-height: 0; overscroll-behavior: contain; }
  .results { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
}
@media (max-width: 860px) {
  .bar { position: static; }
  /* 2.49.7: two compact rows instead of five on a phone */
  .bar { gap: 6px; padding: 8px 12px; }
  .bar .brand { min-width: 70px; }
  .brand span { display: none; }
  .bar .brand { order: 0; }
  .bar .seg.mode { order: 1; }
  .bar .seg:not(.mode) { order: 2; }
  .bar .grow { display: block; order: 3; flex: 0 0 100%; height: 0; }
  .bar #btn-gk { order: 4; }
  .bar #presets { order: 5; flex: 1 1 90px; min-width: 0; max-width: none; }
  .bar #btn-open { order: 6; } .bar #btn-save { order: 7; }
  .bar .btn { padding: 4px 8px; font-size: 13px; }
  .bar .seg button { padding: 4px 8px; font-size: 13px; }
  .bar #presets { flex: 1 1 70px; }
  .layout { grid-template-columns: 1fr; }
  .inputs { border-right: 0; border-bottom: 1px solid var(--line); }
  .inputs .scroll { max-height: none; }
  .results { padding: 16px; }
}

/* ---------- input sections */
details.sec { border-bottom: 1px solid var(--line); }
details.sec > summary {
  list-style: none; cursor: pointer; padding: 11px 16px; display: flex; gap: 10px; align-items: baseline;
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .n {
  font-family: var(--fc); color: var(--muted); width: 1.2em; flex: none;
}
details.sec > summary h2 { font-size: 17px; flex: 1; }
details.sec > summary .sum { color: var(--muted); font-size: 12.5px; text-align: right; max-width: 48%;
  display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
details.sec > summary .advflag { color: var(--amber); }
details.sec[open] > summary { background: var(--sunk); }
.secbody { padding: 10px 16px 16px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row.three { grid-template-columns: 1fr 1fr 1fr; }
label.f { display: grid; gap: 3px; font-size: 13px; color: var(--muted); min-width: 0; }
label.f > span.u { color: var(--muted); }
label.f input, label.f select, textarea {
  width: 100%; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--paper);
  padding: 5px 7px; color: var(--ink); font-size: 14px; min-width: 0;
}
label.f input:focus, label.f select:focus, textarea:focus { border-color: var(--focus); }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.hint b { color: var(--ink); font-weight: 600; }
.note { border-left: 3px solid var(--amber); padding: 6px 10px; background: var(--sunk); font-size: 13px; }
.note.bad { border-color: var(--bad); }
.note.ok { border-color: var(--ok); }
.card { border: 1px solid var(--line); border-radius: var(--r-s); padding: 8px 10px; font-size: 13px; background: var(--paper); }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
.card dt { color: var(--muted); }
.card dd { margin: 0; }
.tbl-wrap { overflow-x: auto; }
table.ed { border-collapse: collapse; font-size: 13px; width: 100%; }
table.ed th { text-align: left; color: var(--muted); font-weight: 500; padding: 2px 3px; white-space: nowrap; }
table.ed td { padding: 1px 2px; }
table.ed input { width: 100%; min-width: 58px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--paper); padding: 3px 4px; }
table.ed td.x { width: 24px; }
textarea { font-size: 13px; resize: vertical; }
textarea.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; white-space: pre; overflow-x: auto; }
table.ed.matlist { font-size: 12px; }
table.ed.matlist td { padding: 3px 4px; vertical-align: top; border-top: 1px solid var(--line); }
table.ed.matlist b { font-weight: 600; }
table.ed.matlist .hint { display: block; }

/* ---------- hero */
/* The life block and the crack ruler share a row only when both get a readable width;
   otherwise the ruler moves under the life number instead of shrinking. */
.hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
  gap: 14px 32px; align-items: end; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.life .num { font-family: var(--fc); font-weight: 600; font-size: clamp(46px, 7vw, 76px); line-height: 0.95; }
.life .unit { font-size: 16px; color: var(--muted); }
.life .status { margin-top: 6px; font-size: 15px; max-width: 46ch; }
.life .status.fail { color: var(--crack); }
.life .base { font-size: 13px; color: var(--muted); }


.ruler { min-width: 0; max-width: 520px; }
.ruler svg { display: block; width: 100%; height: auto; }
.ruler .cap { font-size: 12.5px; color: var(--muted); }

.trace-strip { display: flex; flex-wrap: wrap; gap: 5px; margin: 14px 0 4px; align-items: center; }
.trace-strip .lbl { font-size: 13px; color: var(--muted); margin-right: 4px; }
.trace-strip .lbl em { font-style: normal; opacity: 0.85; }
.tag .q { font-size: 10px; margin-left: 4px; opacity: 0.55; vertical-align: 2px; }
.tag[data-open="true"] .q { opacity: 1; }
.tag {
  font-size: 12px; border: 1px solid var(--line); border-left-width: 4px; border-radius: var(--r-s);
  padding: 1px 6px; background: var(--panel); cursor: help;
}
.tag.V { border-left-color: var(--ok); }
.tag.P { border-left-color: var(--amber); }
.tag.U { border-left-color: var(--bad); color: var(--bad); }
.tag[aria-expanded="true"] { background: var(--sunk); }
.legend-status { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); margin: 2px 0 4px; }
.legend-status b { color: var(--ink); }
.legend-status i.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend-status i.sw.V { background: var(--ok); }
.legend-status i.sw.P { background: var(--amber); }
.legend-status i.sw.U { background: var(--bad); }
/* 2.49.7: the model codes sit in one summary line with the colour counts; they open on demand */
details.trace-box { margin: 14px 0 4px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--panel); }
details.trace-box > summary { cursor: pointer; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; }
details.trace-box > summary em { font-style: normal; color: var(--muted); font-size: 12.5px; }
details.trace-box[open] > summary { border-bottom: 1px solid var(--line); }
details.trace-box .trace-strip, details.trace-box .legend-status, details.trace-box .tagdetail { margin-left: 12px; margin-right: 12px; }
details.trace-box .legend-status { margin-bottom: 10px; }
.trace-sum { display: inline-flex; gap: 12px; font-weight: 600; }
.trace-sum i.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.trace-sum i.sw.V { background: var(--ok); } .trace-sum i.sw.P { background: var(--amber); } .trace-sum i.sw.U { background: var(--bad); }
.trace-sum .u { color: var(--bad); }
.tagdetail { font-size: 13px; background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; border-radius: var(--r-s); margin-top: 6px; }

/* ---------- tabs */
.tabs { display: flex; gap: 2px; flex-wrap: wrap; margin: 18px 0 14px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; border-bottom: 3px solid transparent; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--crack); font-weight: 600; }
.panel { display: grid; gap: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 18px; }
figure { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px 8px; min-width: 0; }
figure h3 { font-size: 16px; }
figure { position: relative; }
.figtools { position: absolute; top: 10px; right: 12px; display: flex; gap: 4px; opacity: 0.45; }
.figtools:hover, figure:hover .figtools, .figtools:focus-within { opacity: 1; }
figure:has(.figtools) > h3 { padding-right: 120px; }   /* 2.53.5: long titles no longer run under the PNG/JPEG buttons */
figure figcaption { font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; }
.plot { width: 100%; height: auto; display: block; overflow: visible; }
.plot text { font-family: var(--f); font-size: 11px; fill: var(--muted); }
.plot .ax { stroke: var(--line); }
.plot .grid { stroke: var(--line); stroke-dasharray: 2 3; opacity: 0.7; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 16px; height: 3px; vertical-align: middle; margin-right: 5px; }

table.data { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.data th { text-align: left; font-weight: 600; border-bottom: 1px solid var(--ink); padding: 5px 8px; white-space: nowrap; }
table.data td { border-bottom: 1px solid var(--line); padding: 5px 8px; vertical-align: top; }
table.data td.num, table.data th.num { text-align: right; white-space: nowrap; }
.pass { color: var(--ok); font-weight: 600; }
.fail { color: var(--bad); font-weight: 600; }
.warnlist { margin: 0; padding-left: 18px; font-size: 13.5px; }
.warnlist li { margin: 2px 0; }
.pill { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }
.pill.V { color: var(--ok); } .pill.P { color: var(--amber); } .pill.U { color: var(--bad); }
.pill.in { color: var(--muted); }

.blocked { border: 2px solid var(--crack); border-radius: var(--r-m); padding: 14px 16px; background: var(--panel); display: grid; gap: 10px; }
.blocked h3 { color: var(--crack); font-size: 19px; }
.empty { padding: 40px 0; color: var(--muted); }
.busy { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .busy { animation: none; } }

.md { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px 22px; max-width: 980px; overflow-x: auto; }
.md h1 { font-size: 26px; margin: 0 0 8px; }
.md h2 { font-size: 19px; margin: 18px 0 6px; }
.md table { border-collapse: collapse; font-size: 12.5px; margin: 6px 0; }
.md th, .md td { border: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
.md code { font-size: 12px; background: var(--sunk); padding: 0 3px; border-radius: 2px; word-break: break-all; }
.md p { margin: 4px 0; max-width: 90ch; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.modal { position: fixed; inset: 0; background: rgba(10, 16, 22, 0.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal > div { background: var(--panel); border-radius: var(--r-m); padding: 16px; width: min(760px, 100%); display: grid; gap: 10px; max-height: 90vh; }
.modal textarea { height: 50vh; font-size: 12px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: var(--r-m); z-index: 60; font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.findings { display: grid; gap: 8px; }
.findings li { max-width: 90ch; }

.card table.units { border-collapse: collapse; font-size: 12.5px; margin: 1px 0 2px; }
.card table.units td { padding: 1px 10px 1px 0; font-variant-numeric: tabular-nums; }
.card table.units td:first-child { font-weight: 600; white-space: nowrap; }
.card table.units tr.internal td { color: var(--muted); font-weight: 400; }

.advice { border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 8px;
  background: var(--panel); padding: 10px 14px; margin: 14px 0 6px; }
.advice.ok { border-left-color: var(--ok); color: var(--muted); font-size: 13.5px; }
.advice .adv-head { font-weight: 600; margin-bottom: 6px; }
.advice .adv-imp { font-weight: 400; font-size: 12.5px; color: var(--bad); margin-left: 6px; }
.advice ul { list-style: none; margin: 0; padding: 0; }
.advice li { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between;
  padding: 6px 0; border-top: 1px dashed var(--line); font-size: 13.5px; }
.advice li:first-child { border-top: 0; }
.advice li.important span::before { content: "\25CF  "; color: var(--bad); }
.advice li.info span::before { content: "\25CB  "; color: var(--muted); }
.advice li .btn { flex: none; }
.advice .hint { margin-top: 6px; }

/* ---------- advanced options inside an input section */
.adv { display: grid; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
.advtoggle {
  justify-self: start; display: inline-flex; align-items: baseline; gap: 7px; background: none; border: 0;
  padding: 3px 0; color: var(--steel); font-weight: 500; cursor: pointer;
}
.advtoggle:hover { color: var(--ink); }
.advtoggle .chev {
  width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent;
  border-bottom: 4px solid transparent; transition: transform 0.15s ease; align-self: center;
}
.advtoggle[aria-expanded="true"] .chev { transform: rotate(90deg); }
.advcount { color: var(--amber); font-size: 12.5px; font-weight: 600; }
.advlist { margin: 0; font-size: 12.5px; color: var(--amber); }
.advbody { display: grid; gap: 10px; padding-left: 12px; border-left: 2px solid var(--line); }
label.f.dv, label.chk.dv { color: var(--amber); }
label.f.dv input, label.f.dv select { border-color: var(--amber); }
.advflag[hidden], .advlist[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .advtoggle .chev { transition: none; } }

/* ---------- sub-navigation inside the Advanced tab */
.subnav { display: grid; gap: 8px; margin-bottom: 16px; }
.seg.sub { justify-self: start; flex-wrap: wrap; }
.seg.sub button { font-size: 14px; }

/* F-30: the input check lists one problem per line */
#results .note.bad { white-space: pre-line; }

/* ---------- phones: result tables as cards, one "label: value" line per column (labelCells in app.js) */
@media (max-width: 600px) {
  #results table.data, #results table.data tbody, #results table.data tr, #results table.data td { display: block; width: 100%; }
  #results table.data thead { display: none; }
  #results table.data tr { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 0 0 10px; }
  #results table.data td { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    border: 0; padding: 3px 0; text-align: right; white-space: normal; overflow-wrap: anywhere; min-width: 0; }
  #results table.data td::before { content: attr(data-label); font-weight: 600; text-align: left; color: var(--muted); flex: 0 0 38%; }
  #results table.data td:not([data-label])::before { content: none; }
  #results .tbl-wrap { overflow-x: visible; }
}

/* ---------- explanation cards (v2.27): basis and rate law */
details.info { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin: 8px 0 12px; background: var(--sunk, transparent); }
details.info > summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); padding: 2px 0; }
details.info[open] > summary { margin-bottom: 6px; }
.info-dl { display: grid; grid-template-columns: minmax(90px, 30%) 1fr; gap: 4px 12px; margin: 4px 0 6px; font-size: 13px; }
.info-dl dt { font-weight: 600; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.info-dl dd { margin: 0; min-width: 0; }
/* 2.53.5: mission help card (missionHelp in app.js): term and unit on one line, meaning below */
.helplist { font-size: 13px; margin: 2px 0 6px; }
.helplist .grp { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 2px; padding-bottom: 3px; border-bottom: 1px solid var(--line); }
.helplist .grp:first-child { margin-top: 4px; }
.helplist .hi { padding: 5px 0; border-bottom: 1px dotted var(--line); }
.helplist .hi .u { color: var(--muted); font-size: 12px; margin-left: 6px; }
.helplist .hi .d { display: block; margin-top: 1px; line-height: 1.4; }
.formula { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; font-size: 16px; margin: 4px 0 8px; overflow-wrap: anywhere; }
.formula.mine { font-size: 15px; padding: 6px 8px; border-left: 3px solid var(--accent, #B8262C); background: rgba(127,127,127,0.07); }
.formula.mine span { font-family: inherit; font-size: 12px; color: var(--muted); margin-right: 6px; }
@media (max-width: 600px) { .info-dl { grid-template-columns: 1fr; } .info-dl dt { margin-top: 4px; } }

/* ---------- formula cards: registry equations (formulaCard in app.js) */
.info .regeq { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 6px; }
.info .regeq .regt { margin: 0 0 2px; font-size: 13px; }
.info .regeq .rid { color: var(--muted); font-size: 12px; }
.info .formula.code { font-family: Consolas, "Courier New", monospace; font-size: 12.5px; overflow-wrap: anywhere; white-space: normal; }

/* what the life number means, under the status (lifeMeaning in app.js) */
.hero .meaning { font-size: 13px; color: var(--muted); margin: 6px 0 0; max-width: 46ch; line-height: 1.45; }

/* ---------- geometry sketch and crack growth animation (sketchSVG, animPanel in app.js) */
.sketchbox { margin: 4px 0 12px; }
svg.sketch { width: 100%; height: auto; display: block; font-family: inherit; }
.animwrap { position: relative; width: 100%; }
.animwrap canvas { position: absolute; inset: 0; width: 100%; height: auto; }
.animwrap #anim-svg { position: relative; }
.animctl { display: flex; align-items: center; gap: 12px; margin: 8px 0 2px; flex-wrap: wrap; }
.animctl input[type=range] { flex: 1 1 200px; }
.animticks { position: relative; height: 8px; margin: 0 0 8px; }
.animticks span { position: absolute; top: 0; width: 2px; height: 8px; background: var(--muted); }
.animread { font-size: 13px; }
svg.sketch text { paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
.animwrap svg.sketch text { stroke: #ffffff; stroke-width: 3.5px; }
.anim .legend { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 6px 0; flex-wrap: wrap; }
.anim .legend .bar { width: 160px; height: 10px; border-radius: 3px; background: linear-gradient(90deg, rgb(40,60,180), rgb(40,170,230), rgb(60,200,90), rgb(245,215,40), rgb(220,40,30)); }

/* ---------- live input check, glossary marks, what changed (decorateInputs, changeBox in app.js) */
#scroll input.invalid, #scroll select.invalid, #scroll textarea.invalid { border-color: #B8262C; box-shadow: 0 0 0 1px #B8262C inset; }
#scroll .fielderr { display: block; color: #B8262C; font-size: 12px; margin-top: 3px; }
#scroll .q { display: inline-block; margin: 0 0 3px 4px; width: 16px; height: 16px; line-height: 15px; border-radius: 50%; border: 1px solid var(--muted);
  color: var(--muted); font-size: 11px; text-align: center; cursor: help; }
.hero .changes { font-size: 12.5px; margin: 8px 0 0; padding: 6px 8px; border-left: 3px solid var(--line); max-width: 52ch; line-height: 1.45; }
.glossary { margin: 10px 0 20px; }

/* Goodman view (2.46) */
.gk { display: grid; grid-template-columns: minmax(340px, 560px) 1fr; min-height: calc(100vh - 56px); }
.gk[hidden], main.layout[hidden], .bar [hidden] { display: none !important; }
.gkin { overflow-y: auto; }
.gk-pad { padding: 14px 16px 30px; display: grid; gap: 10px; }
.gk-h { font-family: var(--fc); font-size: 22px; margin: 0; }
.gk-h3 { font-size: 15px; margin: 8px 0 0; }
table.gk-ed input { min-width: 64px; }
table.gk-ed td:first-child input { min-width: 110px; }
table.gk-ed select { border: 1px solid var(--line); border-radius: var(--r-s); background: var(--paper); padding: 3px 2px; }
#gkpaste { width: 100%; font-family: ui-monospace, monospace; font-size: 12px; }
.life .num.fail { color: var(--crack); }
#btn-gk[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
@media (max-width: 860px) { .gk { grid-template-columns: 1fr; } }
@media (max-width: 600px) {
  #gkres table.data, #gkres table.data tbody, #gkres table.data tr, #gkres table.data td { display: block; width: 100%; }
  #gkres table.data thead { display: none; }
  #gkres table.data tr { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 0 0 10px; }
  #gkres table.data td { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border: 0; padding: 2px 0; }
  #gkres table.data td::before { content: attr(data-label); font-weight: 600; text-align: left; color: var(--muted); flex: 0 0 38%; }
}

/* section 0: source tiers */
.tierb { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); white-space: nowrap; }
.tierb.t1 { border-color: var(--steel); color: var(--steel); }
.tierb.t2 { border-color: var(--ok); color: var(--ok); }
.tierb.t3 { border-color: var(--amber); color: var(--amber); }
.tierb.t4, .tierb.t5 { border-color: var(--bad); color: var(--bad); }
h3.tierh { margin: 14px 0 2px; }
ol.srcrules { margin: 6px 0 10px; padding-left: 20px; }
ol.srcrules li { margin: 2px 0; }
ul.srclist { list-style: none; margin: 4px 0 8px; padding: 0; }
ul.srclist li { padding: 5px 0; border-bottom: 1px solid var(--line); }
ul.srclist li:last-child { border-bottom: 0; }
.srcuse { font-size: 13px; margin-top: 1px; }
details.cite summary { cursor: pointer; }
details.cite[open] summary { margin-bottom: 3px; }

/* ---------- phones and small tablets (2.53): one pane at a time, bottom navigation, thumb-sized controls.
   Desktop (861 px and wider) is unchanged: these elements stay hidden there. */
:root { --nav-h: 58px; }
.mnav, .mrun, .gkseg { display: none; }
@media (max-width: 860px) {
  body { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }

  .mnav {
    display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  .mnav button {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    height: var(--nav-h); border: 0; background: none; color: var(--muted); cursor: pointer;
    font-family: var(--fc); font-size: 13px; font-weight: 600; letter-spacing: 0.01em; -webkit-tap-highlight-color: transparent;
  }
  .mnav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .mnav button[aria-current="page"] { color: var(--ink); }
  .mnav button[aria-current="page"]::before {
    content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--crack); border-radius: 0 0 3px 3px;
  }
  .mnav .dot { display: none; position: absolute; top: 8px; left: calc(50% + 9px); width: 9px; height: 9px; border-radius: 50%;
    background: var(--amber); border: 2px solid var(--panel); }
  body[data-stale="1"] .mnav .dot { display: block; }

  /* one pane at a time */
  body[data-pane="results"] main.layout > .inputs,
  body[data-pane="input"] main.layout > .results { display: none; }
  .layout { min-height: 0; }
  .inputs { border-bottom: 0; }
  .inputs .runbox { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 30; }
  .results { padding: 14px 16px 96px; }

  /* recalculate from the results pane when the inputs changed */
  .mrun {
    position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 39;
    align-items: center; gap: 12px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
    background: var(--panel); border-top: 1px solid var(--line);
  }
  body[data-pane="results"][data-stale="1"] .mrun { display: flex; }
  .mrun span { flex: 1; font-size: 13px; color: var(--amber); line-height: 1.3; }
  .mrun .btn.run { width: auto; flex: none; font-size: 15px; padding: 9px 16px; }

  /* top bar: the Goodman switch moves to the bottom navigation */
  .bar #btn-gk { display: none; }
  .bar .btn, .bar .seg button { min-height: 36px; }

  /* result tabs: one row that scrolls sideways and stays in reach */
  #results .tabs {
    flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--paper);
    margin: 14px -16px 12px; padding: 0 16px;
  }
  #results .tabs::-webkit-scrollbar { display: none; }
  #results .tabs button { flex: none; padding: 13px 12px 10px; }
  .figtools { opacity: 1; }
  .toast { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px); max-width: calc(100% - 32px); }

  /* touch-sized inputs; 16 px text keeps phone browsers from zooming in on focus */
  details.sec > summary { padding: 14px 16px; min-height: 52px; align-items: center; }
  details.sec > summary h2 { font-size: 17.5px; }
  label.f { font-size: 13.5px; }
  label.f input, label.f select, textarea, table.ed input, table.gk-ed select, #gkpaste { font-size: 16px; }
  label.f input, label.f select { padding: 8px 9px; min-height: 42px; }
  table.ed input { padding: 6px 6px; min-height: 38px; }
  label.chk { min-height: 40px; font-size: 15px; }
  label.chk input { width: 20px; height: 20px; }
  .advtoggle { padding: 8px 0; }
  .btn.small { padding: 6px 10px; font-size: 14px; }
  details.info > summary, details.trace-box > summary { padding-top: 8px; padding-bottom: 8px; }

  /* Goodman view: data and results as two panes */
  .gkseg { display: inline-flex; justify-self: start; margin: 12px 16px 2px; }
  .gkseg button { min-height: 38px; padding: 6px 18px; font-weight: 600; }
  body[data-gkpane="res"] #gkin, body[data-gkpane="data"] #gkres { display: none; }
  #gkres { padding-bottom: 40px; }
}
@media (max-width: 860px) and (prefers-reduced-motion: no-preference) {
  .mnav button[aria-current="page"]::before { animation: navmark 0.18s ease-out; }
  @keyframes navmark { from { transform: scaleX(0.3); opacity: 0; } to { transform: none; opacity: 1; } }
}

/* 2.53.1: report a start-up failure on the page itself (phones have no console) */
(function () {
  var errs = [];
  function show(txt, bad) { var b = document.getElementById("bootmsg"); if (!b) return; b.hidden = false; b.textContent = txt; b.className = bad ? "bootmsg bad" : "bootmsg"; }

  window.addEventListener("error", function (e) {
    if (window.__damtolStarted) return;

    window.__damtolBootError(m + (e && e.lineno ? " (line " + e.lineno + ")" : ""));
  });
  setTimeout(function () {
    if (!window.__damtolStarted && !errs.length) show("Masih memuat. Kalau halaman tetap kosong, tutup lalu buka lagi, atau kirim screenshot ini ke pengembang.", true);

})();

beta), z = 1/(1 + 2a/D), lambda = (pi/2)(D + a)/(2B - a), beta = D/B - 2D/W","source":"DTDH 11.3 Tables 11.3.10 to 11.3.12","status":"V","check":"tests/test_beta.py: f0(1) = 3.365 and f0(0) = 0.7071 (Bowie limits); tests/test_tada.py: f0 is within 0.7 % of the numerical solution of DSTO-RR-0005 for s = 0.05 to 0.95. The closed form of Tada 19.2 is not used: it departs up to 4.8 % from the same numerical solution","limits":"B = distance hole centre to edge","note":""},"B-HOLE2":{"id":"B-HOLE2","title":"Two symmetric through cracks at a hole","equation":"F = F0(s) C(s) sqrt(sec(pi (r + a)/W)), F0 = 0.5(3 - s)(1 + 1.243(1 - s)^3) (Tada 19.1), C = F_numerical / F0 from DSTO-RR-0005, linear in s, s = a/(a + r)","source":"TADA section 19.1; DSTO9405; NEWMAN1971","status":"P","check":"tests/test_tada.py: F0 read from Tada 19.1; the corrected F reproduces DSTO-RR-0005 at its points and NASA TN D-6376 Table I within 0.4 %; the plain Tada form was up to 2.1 % low (F-25). P because the finite-width factor is an engineering estimate, not from these sources","limits":"","note":""},"B-CORNER-PLATE":{"id":"B-CORNER-PLATE","title":"Quarter-elliptical corner crack at a plate edge, tension and bending","equation":"TM-85793 eqs 37-44: F = [M1 + M2 (a/t)^2 + M3 (a/t)^4] g1 g2 f_phi f_w, K = (St + H Sb) sqrt(pi a / Q) F, f_w = 1 - 0.2 L + 9.4 L^2 - 19.4 L^3 + 27.1 L^4, L = (c/b) sqrt(a/t); bending multiplier H eqs 20-24 with G22 eq 46 (since 2.40, input bending share b: St = (1 - b) S, Sb = b S); then an edge through crack","source":"TM85793","status":"P","check":"tests/test_new_cracks.py: eq. 45 of TM-85793 (a/t -> 1, a/c = 1, phi = 0: K = 1.11 S sqrt(pi a) fw) reproduced, f_phi and Q as for B-SURF, Python and web engine identical. tests/test_bending.py (2.40): FcHc against the finite-element bending results of TM-85793 Table 2 (a/c 0.2, 0.4, 1; a/t 0.2, 0.5, 0.8) within 8.5 % for a/t <= 0.5 and 18 % at the plate face for a/c 0.2, a/t 0.8, where the equation is higher. P until the tension results are compared with finite elements (figure 7, graphs only)","limits":"0.2 <= a/c <= 1 as implemented, a/t <= 0.8 for stated accuracy, c/b < 0.5. With bending, after breakthrough the edge through crack takes the outer-fibre stress as tension (conservative); a fixed shape at the depth point is rejected with bending (since 2.40.1; use two-DOF or the surface point)","note":""},"B-EMBEDDED":{"id":"B-EMBEDDED","title":"Embedded elliptical crack at mid-thickness, tension","equation":"TM-85793 eqs 3-13: F = [M1 + M2 (a/t)^2 + M3 (a/t)^4] g f_phi f_w with t and b the half thickness and half width, K = S sqrt(pi a / Q) F; at breakthrough a centre through crack (NASGRO EC01 -> TC01, Table 6b)","source":"TM85793","status":"P","check":"tests/test_new_cracks.py: a/t -> 0 with a/c = 1 gives the penny-shaped crack 2/pi (Irwin, exact), a/c small gives Irwin's f_phi variation, and since 2.48 (F-64) a/c 1.5 to 4 matches the exact Irwin ellipse at both tips (eq 13; until 2.47 its terms were swapped, the a-tip 41 % high and the c-tip 29 % low at a/c 2), Python and web engine identical. P until compared with the paper's finite-element results (figure 4, graphs only)","limits":"a/t <= 0.8 for stated accuracy (paper: within about 3 %), c/b < 0.5; centred in the thickness, so both fronts break through together and the crack becomes a through crack of length 2c (NASGRO Table 6b)","note":""},"B-ROD-SURF":{"id":"B-ROD-SURF","title":"Circumferential surface crack in a solid round bar (NASGRO SC07 configuration)","equation":"K = S sqrt(pi a / Q) [(1 - b) F_t + b F_b], F from the finite-element table of TM-87594 (a/D 0.05 to 0.35, a/c 0.6 to 1, points A and B), bilinear interpolation, S the outer-fibre stress, b the bending share","source":"TM87594 Table 3","status":"P","check":"tests/test_rod.py: every tabulated value reproduced (tension and bending, A and B), bending share 0 and 1 give the two tables and 0.5 their mean, Python and web engine identical. P: the values between table points (linear) and the rules outside the table are damtol's; the paper reports agreement within about 10 % with other solutions and tests. Two-DOF (since 2.38, F-40): A for the depth and B for the surface tip; in tension and bending the shape settles at a/c 0.69 to 0.79 from initial 0.6 and 1.0, inside the table (tests/test_rod.py)","limits":"a/D 0.05 to 0.35 (growth ends at 0.35), a/c 0.6 to 1 (held to the nearest table value outside), crack front meeting the surface at right angles, c measured as arc length","note":""},"B-SURF":{"id":"B-SURF","title":"Semi-elliptical surface crack in a plate, tension and bending","equation":"TM-85793 eqs 14-19 and 11 (fw), evaluated at phi = 90 deg (depth) and phi = 0 (surface); K = (St + H Sb) sqrt(pi a / Q) F with the bending multiplier H of eqs 20-25 (since 2.40, input bending share b: St = (1 - b) S, Sb = b S, S the outer-fibre stress)","source":"TM85793","status":"V","check":"tests/test_beta.py: transcribed from NASA TM-85793 (1984), fw uses b = W/2. tests/test_bending.py (2.40): against the finite-element results of NASA TP-1578 Table I (a/c 0.2 to 1, a/t 0.2 to 0.8, nine angles, c/b = 0.2) within 6.9 % in tension (5.1 % with fw = 1; TP-1578 puts the width effect of the finite elements below 1 % for c/b <= 0.2) and 7.4 % in bending, largest at a/t = 0.8 where the equation is higher; H = 1 at a/t = 0; under pure bending K at the depth point changes sign at a/t 0.73 for a/c = 1, as in the table","limits":"0 <= a/c <= 1 implemented (since 2.48, F-63, down to the single-edge crack limit a/c = 0 that eq 14 is fitted to; until 2.47 a/c was held at 0.05, the depth point 11 to 43 % low at a/c 0.03 to 0.01); a/c > 1 is held at 1 (conservative, with a warning), a/t < 0.8 within about 7 % of FE, c/b < 0.5. With bending, after breakthrough the through crack takes the outer-fibre stress as tension (conservative); a fixed shape at the depth point is rejected with bending (since 2.40.1: 1.5 to 135 times the two-DOF life for bending shares 0.3 to 1, and grid-dependent where the depth K falls to zero): use two-DOF or the surface point","note":"The transition to a centre through crack after breakthrough matches NASGRO Table 2.2.2, case SC01 to TC01."},"B-CORNER-HOLE":{"id":"B-CORNER-HOLE","title":"Quarter-elliptical corner crack at a hole, tension","equation":"TM-85793 eqs 65-74 for two symmetric cracks, fw eq 62, single crack by the Shah conversion eq 64","source":"TM85793","status":"V","check":"tests/test_beta.py: g4 also matches DTDH Table 11.3.12; eq 62 reduces to Feddersen for n = 2 and a = t","limits":"0.2 <= a/c <= 1, a/t < 1, 0.5 <= r/t <= 2, (r + c)/b < 0.5","note":"Corrected in v2: fw first term is sec(pi r / 2b), denominator 4(b - c) + 2nc, and the single-crack Shah factor is applied. v1 overestimated beta by about 20%. The phase transition used here (single corner crack at a hole becomes a through crack at the same hole) matches NASGRO Table 2.2.2, cases CC04 and CC07 to TC03 for one crack."},"B-CORNER-HOLE-BEND":{"id":"B-CORNER-HOLE-BEND","title":"Quarter-elliptical corner crack at a hole, tension and bending","equation":"TM-85793 eq 65: K = sqrt(pi a / Q) [St F + Hch Sb F'] with St = (1 - b) S, Sb = b S (S outer-fibre stress, b bending share); F = B-CORNER-HOLE (eqs 66-74, fw eq 62, Shah eq 64); F' the same with mu = 0.85 - 0.25 (a/t)^(1/4) in lambda (eq 72); Hch = H1 + (H2 - H1) sin^p(phi) (eq 20) with p, H1, H2 and G11 to G23 of eqs 75-83 (a/c <= 1)","source":"TM85793","status":"P","check":"tests/test_bending.py (2.44): eqs 75-83 read from the page images of the owner's copy and coded twice (the test has its own transcription); H = 1 and F' = F at a/t = 0; under pure bending the bore-point K (phi = 90) turns negative near a/t 0.8 for a/c 1 (H2 = -0.11), the surface-point K stays positive; Python and web engine identical. P until compared with the finite-element results of Raju & Newman (TM-85793 ref. 18) or figure 11 (graphs only)","limits":"as B-CORNER-HOLE (0.2 <= a/c <= 1 as implemented e life is iterated until it changes by less than 0.1 %. Sourced: the 0.005 in far-side crack plus its growth Delta a (DTDH 6.2.2) and a 0.005 in flaw at every hole whose interaction must be considered (1.3.8, 1.3.28). The tool's own: the equivalent centre crack (DTDH 6.2.1: 'no general rules can be given'), MSD cracks of equal size at every hole ahead, and the flaw growth without retardation and without the lead-crack interaction","limits":"the travel per bay is pitch - D - far-side crack - next MSD crack; when the grown cracks close the ligament, link-up is immediate (warned)","note":"Until 2.49.4 the cracks did not grow, the MSD crack was 0 by default and the far-side crack was added to the travel as well as to the jump. Not a widespread fatigue damage (WFD) assessment"},"RS-LINKUP":{"id":"RS-LINKUP","title":"Swift ligament yield (plastic-zone link-up) of an MSD ligament","equation":"P = sigma_ys t W_net sqrt(2 b / (a1 beta_h^2 beta_i1^2 (W_net/W_MSD)^2 + a2 beta_i2^2 (W_net/W_lead)^2)) (eq. 7), from R = (1/2 pi)(K/sigma_ys)^2 at both tips adding up to the gap b; beta_h the Bowie factor of the Grandt fit (two cracks), beta_i the Kamei-Yokobori interaction of the lead crack and the MSD crack (hole plus cracks), W_MSD = W_net + D + 2 a1, W_lead = W_net + 2 a2 (assumed)","source":"CHERRY1997 eqs 1 to 7 and Fig. 5; MAKOBA2000; AR951","status":"P","check":"tests/test_holerow.py: the plastic zone equality of eqs 3 to 5 holds at the computed load; the elliptic integrals agree with scipy to 1e-13. Against the 13 panels of Cherry et al. (1997) Tables 1 to 5 (tests/data/cherry1997.json) eq. 7 as coded gives 5.2 % mean absolute error on the measured loads (4.1 % wide panels, largest 10.6 %), the same as Cherry's own predictions (5.16 %). W_lead and the narrow-panel pitch (19.05 mm) are not printed in the paper and are assumed. Ma et al. (2000) Table 2, with the (1/pi) form and no interaction: +19.5 to +78 % on MSD2 and MSD3, -36 % to +1 % on MSD5. Independent check on six 2286 mm panels of DOT/FAA/AR-95/1 (tests/data/ar95_1.json): first link-up 15 % mean absolute error (Broek's own predictions 11 %); -19 to +2 % for ligaments of 6 to 10 mm, unconservative +18 % and +39 % for 19 and 33 mm; second link-up +20 to +44 % (five panels)","limits":"unstiffened 2024-T3 panels, 1 to 2.3 mm, 229 to 2286 mm wide; validated for ligaments of 6 to 14 mm at link-up (Cherry 10 to 14 mm, AR-95/1 6 to 10 mm); longer ligaments are over-predicted because stable tearing before link-up is not modelled, and a result governed by link-up beyond 14 mm is warned; in the hole row the MSD cracks ahead are taken equal and at the size reached at the end of the bay (conservative)","note":"2.49.5: until 2.49.4 the form of Ma et al. (1/pi, no interaction, no width terms) with the collapse stress as default was used together with Cherry's accuracy, which belongs to eq. 7 with the yield stress (the collapse stress raised the link-up load by about 19 %). For stable-tearing link-up, T-epsilon or CTOA criteria are more accurate"},"B-STIFF-POE":{"id":"B-STIFF-POE","title":"Stiffened sheet: beta, rivet and stringer loads by displacement compatibility","equation":"rivets on a row through the crack, stringers of area A_s at spacing b and rivet pitch p; equal sheet and stringer displacements at every rivet (rigid rivets); K = S sqrt(pi a) + K of the crack-face tractions of the rivet forces (Love point forces, Westergaard crack-face Green function); lambda = largest rivet force / S, L = 1 + sum of rivet forces on a stringer / (A_s S_s)","source":"POE1971 appendix A; BROEK1986 16.2","status":"P","check":"tests/test_stiffened.py: crack-face Green function against the Westergaard centre crack (opening to 7 digits), Maxwell-Betti symmetry of the cracked-sheet flexibility (1e-15), beta -> 1 as the stringer area -> 0, beta about 1 for crack lengths up to b/2 midway between stringers (Poe), minimum beta just past each stringer (Poe; Broek 16.2), L -> 1/mu for long cracks (Poe eq. 12), Py in any unit system (tests/test_laws.py). Until 2.44 C was used as C_F, which divided the rate by (1 - R) Kc - dK in the internal units, about 1000 MPa sqrt(mm): lives up to 400 times too long (F-51)","limits":"no closure and no threshold term: 2.7 to 5 times the NASGRO rate for 2024-T3, 7075-T651 and 2024-T81 at R 0.1 and 0.5 (conservative), and it ignores the threshold; prefer NASGRO","note":""},"L-TABLE":{"id":"L-TABLE","title":"Table look-up of da/dN against dK and R (2.50)","equation":"log da/dN linear in log dK within a table and linear in R between the two tables around R; no growth at or below the first point of a table (threshold), fracture above its last point","source":"NASGRO 2.2.4","status":"P","check":"tests/test_table_law.py: the table points come back exactly, R interpolation, threshold and fracture cut-offs, units, input checks; web/xcheck: Python and JS engines agree","limits":"the meaning of the first and last point (threshold dKth(R), fracture dKc(R)) is that of the 1-D and 2-D tables of NASGRO 4.02 section 2.2.4 (pp. 61-62). Interpolation (Appendix F of the manual, read 22 Oct 2026, pp. F-1 to F-3): NASGRO fits log da/dN against log dK with piecewise Hermite cubics (slope at a point = mean of the two adjacent secant slopes, end slopes S1 = 2 S2 - S3) and, for 2-D tables, cubic splines of ln dK against R at constant da/dN (end conditions not stated). damtol stays log-linear in a table and linear in R. On tables sampled from the 2024-T3 NASGRO fit the two in-table methods differ by 1 % in life at 5 points per table and 0.1 % at 8 or more (tests/test_table_law.py); the R direction cannot be reproduced exactly, so give tables at R steps of 0.2 or less. R below the first table: the first table (conservative); above the last: the last table, warned (not conservative). R < 0: Kmax with R = 0. The table data are the user's (MAT-USER): a licensed handbook table stays in the user's own case file","note":""},"L-NASGRO":{"id":"L-NASGRO","title":"NASGRO equation","equation":"da/dN = C [((1-f)/(1-R)) dK]^n (1 - dKth/dK)^p / (1 - Kmax/Kc)^q","source":"FAA0515 eq 1","status":"V","check":"tests/test_laws.py and the Virkler blind prediction","limits":"","note":""},"L-NASGRO-TH":{"id":"L-NASGRO-TH","title":"NASGRO threshold stress intensity range","equation":"dKth = dK1* [(1 - R)/(1 - f)]^(1 + R Cth+) / (1 - A0)^((1 - R) Cth+) for R >= 0, dK1* [(1 - R)/(1 - f)]^(1 + R Cth-) / (1 - A0)^(Cth+ - R Cth-) for R < 0, dK1* = dK1 sqrt(a/(a + a0)), a0 = 0.0015 in, dK1 the threshold as R -> 1","source":"NASGRO","status":"V","check":"tests/test_nasgro_manual.py: equations 2.11a, 2.11b, 2.12 and 2.13 of the NASGRO Reference Manual v4.02, written out from the manual's text (section 2.1.3, p. 10 and 13), reproduced to 1e-12; dKth(R = 0) = dK0 = dK1/(1 - A0)^(1 + Cth+) (eq 2.13), 2.91 ksi sqrt(in) for 2024-T3 L-T, and dKth -> dK1 as R -> 1. F-57 (2.48): until 2.47 the NASGRO 3.0 form with dK1 in place of dK0 was used, a threshold lower by (1 - A0)^(1 + Cth+) (0.42 for 2024-T3) at every R, and the old test re-typed the code. DOT/FAA/AR-05/15 prints its fits as 'NASGRO 4.0 equation fit' with DK1. Section 2.1.3 requires f and A0 in the threshold to use the average fit constants alpha = 2.0 and Smax/sigma0 = 0.3 rather than the material's own; enforced and tested in both engines. Cth (F-77, 2.48), section 2.1.3: NASGRO uses Cth = 0 with its load-interaction models, and for the non-interaction model starts at 0 and rises to the file value once the load level falls (option 1); material.cth = nasgro (default) does the same (file values for a spectrum with two or more maximum stresses at R > -0.25, 0 for constant amplitude and with retardation), zero and file are options 2 and 3 (tests/test_audit_248.py)","limits":"dK1 and Cth come from the material file; Cth for negative R is 0.1","note":""},"L-NASGRO-KC":{"id":"L-NASGRO-KC","title":"Toughness: Kc(t) for through cracks, KIe for part-through cracks","equation":"Kc = K1c [1 + Bk exp(-(Ak t / t0)^2)], t0 = 2.5 (K1c / sys)^2; since 2.41 (F-44) part-through phases use KIe = K1c (1 + Ck K1c / sys) <= 1.4 K1c, Ck = 0.19842 per sqrt(mm) (NASGRO 4.02 eq 2.16, section 2.1.4) in the rate law (\"Kc in Eq 2.1 is set equal to a constant value of KIe\") and in the residual strength, where it is multiplied by 1.1 at the c-tip of a surface crack and at the corner points of a corner crack (section 2.1.5, failure criteria only; until 2.47 the 1.1 was also used in the rate law, F-56); through cracks keep Kc(t), at the part thickness when the material has none (F-61, 2.48), and an override of KIc, yield, Ak, Bk or thickness recomputes it (F-60)","source":"NASGRO","status":"V","check":"tests/test_laws.py: reproduces every Kc(t) printed in DOT/FAA/AR-05/15 Appendix B; tests/test_kie.py: eq 2.16 in inch-pound units with Ck = 1, the 1.4 K1c limit, phase and tip factors of all five part-through models, the rate law with the tip toughness","limits":"","note":""},"MAT-UTS":{"id":"MAT-UTS","title":"Ultimate strength for the flow stress, 13 FAA alloys","equation":"su from the chosen source (material.uts_source): faa_low (default since 2.51: lower bound of the ultimate strength range of the DOT/FAA/AR-05/15 Appendix B material table), faa_mid (mid-range) or mmpds (MMPDS-16 Ftu by thickness from the owner's local licensed file, Python only; without it the FAA lower bound with a note); a user su (material.overrides.su, its source in material.su_ref) wins; flow stress (sy + su) / 2 for net-section yield","source":"FAA0515 Appendix B; MMPDS16","status":"V","check":"tests/test_uts.py: the 13 FAA ranges equal to Tables B-1 to B-25 as read from the report, the default, the user value and its source label, the fallback without the local file, the band choice by thickness with the local file (skipped without it), Python and web identical. F-45: until 2.41 su was 1.2 YS (no source), above the FAA range for 6 of 13 alloys. 2.43 to 2.50 the MMPDS-16 Ftu values were bundled; since 2.51 they are licensed data kept outside the package (owner's decision, 15 Oct 2026)","limits":"the FAA ranges describe the test lots, not design allowables: for a certification analysis enter the design Ftu (for example MMPDS A-basis for the product and thickness) as su with its source. On the example (2024-T3 clad, 5 mm) the FAA lower bound 62 ksi is slightly below the MMPDS-16 A-basis value","note":""},"MAT-FAA":{"id":"MAT-FAA","title":"Material constants, 13 aluminium alloys (DOT/FAA/AR-05/15)","equation":"NASGRO and Walker parameters as printed","source":"FAA0515 Figures 2, 3 and Appendix B; MMPDS16","status":"V","check":"tests/test_paris.py: Walker C, n, m round-trip to the printed Fig. 3 values; tests/test_laws.py: NASGRO Kc(t) reproduces the printed values; values transcribed from the report text; Kc cross-checked through L-NASGRO-KC. 2.41: the NASGRO parameter boxes of 11 materials compared one by one with the report figures (C, n, p, q, DK1, Cth, K1c, YS, Ak, Bk, t), the other two through the printed Kc test; Walker m- of 2024-T3 L-T (0.164), 2024-T351 (0.023), 7475-T7351 (0.067) and the 7075-T7351 Walker fit (0.451E-08, 3.157, 0.624, 0.071) from the report (F-46). 2.44: 7050-T7451 against independent data, the MMPDS-16 typical crack growth Tables 3.7.5.2.9(a) and (b) (tests/test_mmpds_fcg.py): at R 0.1, L-T, the MMPDS rates are 0.98 to 1.12 times the NASGRO fit at dK 7 to 20 ksi sqrt(in) (0.95 to 1.16 from 5.6 to 31.6; 0.79 to 0.95 with the NASGRO 3.0-form threshold of 2.47 and before, F-57) and 1.09 to 1.60 times the Walker fit (F-49). 2.48 audit: all 13 parameter boxes, the Walker fits, the printed Kc and the ultimate strength ranges compared again with Appendix B: no difference","limits":"","note":""},"MAT-AE4039":{"id":"MAT-AE4039","title":"AE4039 legacy constants (not a valid Paris fit)","equation":"C = 1.55e-10 m/cycle, m = 3.29 (MPa sqrt m), as AE4039 Table 5","source":"AE4039 Table 5; ABDULLAH2011 Table 4","status":"U","check":"AE4039 Table 5 cites Abdullah, Beden & Ariffin (2011), its reference 9. In that chapter, Table 4 (2024-T3 data from ASM handbooks) gives 1.5451e-10 m/(MPa sqrt m)^(n-1) and 3.284 as the coefficient and exponent of the modified Forman equation (its eq. 10, with p 0.5 and q 1), not as Paris constants; read from the chapter's web text on 15 Oct 2026, the page image is still to be checked. Used as Paris they grow the Virkler specimens several times faster than the test data. 2.50.1: m = 3.29 as printed in AE4039 (was 3.299); hidden from the web app lists, kept only so case V08 repeats the AE4039 report","limits":"do not use for an analysis; for 2024-T3 use the FAA fits (NASGRO, Walker, or Paris from the Walker C and n)","note":""},"MAT-USER":{"id":"MAT-USER","title":"User-supplied material constants","equation":"as entered","source":"user","status":"U","check":"document the test data or handbook the constants came from","limits":"","note":""},"G-BLOCK":{"id":"G-BLOCK","title":"Block integration of crack growth","equation":"N = integral da / sum(n_i da/dN_i), Gauss-Legendre on a geometric grid","source":"DTDH 5.5","status":"V","check":"tests/test_growth.py: closed form to 1e-6","limits":"","note":""},"G-CYCLE":{"id":"G-CYCLE","title":"Cycle-by-cycle integration","equation":"chunked integration with the crack length frozen within a chunk, predictor-corrector; the smallest chunk is 64 cycles (64 rows of one cycle), and a row of more cycles is split when it grows the crack too far (F-55, 2.48; until 2.47 the floor was 64 rows whatever they carried: 8 to 30 % too long a life for rows of 1000 cycles)","source":"DTDH 5.5","status":"V","check":"tests/test_growth.py: with no retardation it matches G-BLOCK within 0.5%, also for rows of 999 and 1000 cycles (tests/test_growth.py, F-55)","limits":"","note":""},"R-WHEELER":{"id":"R-WHEELER","title":"Wheeler retardation","equation":"Cp = (rp_i / (a_OL + rp_OL - a_i))^m, rp = (1/(alpha pi)) (Kmax/sy)^2","source":"DTDH 5.2 eq 5.2.2","status":"P","check":"form verified; the exponent is empirical and must be calibrated to spectrum tests","limits":"","note":""},"R-WILLENBORG":{"id":"R-WILLENBORG","title":"Generalized Willenborg retardation","equation":"KR = phi [KOL sqrt(1 - (a - aOL)/rpOL) - Kmax], phi = (1 - Kmax,th/Kmax)/(SOL - 1)","source":"DTDH 5.2 eqs 5.2.3 to 5.2.7a","status":"P","check":"form verified; v1 used dKth/dK in phi, corrected to Kmax,th/Kmax in v2. Shut-off ratio SOL is empirical. Against tests (tests/test_validation_zhang.py, VALIDATION 2.6): Zhang et al. 1987, 7475-T7351, overloads every 50 or 100 cycles; the retardation factor agrees with NASGRO 4.02 within about 15 %; SOL 3.0 was conservative for all four load types (test/predicted 1.02 to 1.64 since 2.48, 1.07 to 1.66 before), SOL 2.3 predicted up to 17 % (20 %) more life than the tests F-47 (2.41): a KR below 1e-12 Kmax (a repeated peak, from rounding) is taken as zero, so it no longer switches the R cut-off on; Python and web identical on the r_cut cases (tests/test_kie.py). 2.48 audit: the overload zone is the Irwin form (1/(alpha pi)) (Kmax/sy)^2 of RAPID Fig. 12 with one alpha for both tips; NASGRO 4.02 eq 2.22 uses the Dugdale form (pi/8)(Kmax/(alpha_g sy))^2 with alpha_g between 1.15 and 2.55 (eq 2.23), which gives a smaller zone and, for overloads every 10,000 cycles, 0.4 to 0.7 times this life except near plane stress. Calibrate SOL and alpha to spectrum tests. The shut-off arrest of NASGRO (growth stops once the overload ratio exceeds SOL) is not applied (conservative)","limits":"","note":""},"G-TRANSITION":{"id":"G-TRANSITION","title":"Part-through to through-crack transition","equation":"at a = 0.95 t the part-through crack becomes a through crack of length c; the retardation state is reset at the phase change","source":"NASGRO 2.2.2; MEGCAS2003","status":"P","check":"tests/test_transition.py: the K jump at the surface tip is 0.98 to 1.03 for a/c 1.0 to 0.8 and 1.30 for a/c 0.4; under constant amplitude Wheeler returns the unretarded life across the transition, so no false overload is created","limits":"immediate transition; NASGRO 4.02 (sections 2.1.6 and 2.2.2, Table 6b; Table 2.2.2 in the 2022 manual) transitions when the depth exceeds the thickness, damtol at 0.95 t by default (input breakthrough; 1.0 follows NASGRO; the difference was 0.1 % in a surface and a corner crack case, 2.35)","note":"Meggiolaro & Castro (2003) show the immediate transition is conservative; tests by Fawaz (1997) show the front stays elliptical while a' grows from t to about 2.3 t. Their continuous transitional model is not implemented"},"G-2DOF":{"id":"G-2DOF","title":"Two-degree-of-freedom part-through growth","equation":"da/dN from dK at the depth tip, dc/dN from dK at the surface tip; RK4 on dc/da in the block solver, both tips advanced per chunk in the cycle solver","source":"TM85793","status":"P","check":"tests/test_growth.py: with both tips evaluated at the same angle, c - a stays constant. tests/test_liu_chu.py: for a 7075-T6 plate in tension (n = 3.8) the shape settles at a/c 0.72 to 0.79 by a/t = 0.9 from initial a/c 1.0, 0.8 and 0.6, inside the 0.7 to 0.8 band of the Putra & Schijve tests reported by Liu & Chu (2014); shallow starts (0.4, 0.2) move the same way but reach only 0.65 to 0.72. tests/test_two_dof_rate.py (F-40, F-41, 2.38): where the rate law becomes unbounded (Kmax reaches Kc) the step is shortened and the crack fails there, Kmax/Kc = 1.000 at the reported critical size and the life converged to 1e-5 under step refinement; the cycle solver finds the failing cycle within its last chunk and agrees with the block solver within 0.5 % in life. F-42 (2.40): when the depth tip does not grow (below threshold, or closed by bending) while the surface tip does, the block solver steps in c instead of reporting an arrest (tests/test_bending.py)","limits":"same range as the beta solution used; at the end of growth the crack fails when Kmax reaches Kc at the spectrum peak (before 2.38 this could be reported as an arrest, F-40)","note":"DTDH Table 11.3.8 evaluates phi = 10 and 80 degrees rather than 0 and 90; both conventions are selectable. The 80/10 convention is closer to the tests. A two-point model converges more slowly than the tests for very shallow initial cracks"},"G-ORDER":{"id":"G-ORDER","title":"Cycle order for retardation","equation":"rainflow cycles ordered by the time of their peak","source":"damtol","status":"P","check":"better than rainflow closure order, still not a full peak-valley sequence model","limits":"","note":""},"RS-LEFM":{"id":"RS-LEFM","title":"Residual strength, LEFM","equation":"sigma_c = Kc / (F sqrt(pi a)), with the toughness of the phase and tip (Kc(t), or KIe and its tip factor for a part-through crack, F-44); a two-tip crack takes the lower allowable of the two tips","source":"DTDH 2.3, 4.2","status":"V","check":"tests/test_handbook.py: DTDH Example 4.4.1 critical crack and diagram points; tests/test_ae4039.py: report critical crack 20.7 mm","limits":"","note":""},"RS-NET":{"id":"RS-NET","title":"Net-section yield limit","equation":"sigma_c = sigma_flow * A_net / A_gross","source":"NASGRO Appendix B; DTDH 4.2","status":"P","check":"tests/test_nasgro_appb.py (2.54): the net areas equal the axial terms of NASGRO 4.02 Appendix B (read 22 Oct 2026) for TC01, TC02, TC03, CC01, CC02, CC04, EC01 and SC01, and the flow stress is (sy + su)/2 as on p. B-1","limits":"","note":"P: NASGRO adds the bending stress of an asymmetric net section (corner, surface, edge and one-sided hole cracks), taken at a fraction 0.13 of the section inward from the edge; damtol does so only with the option crack.net_bending (RS-NET-BEND, 2.54; transport example 2,190 -> 1,748 flights). DTDH 4.2 (read 22 Oct 2026) gives the ultimate strength criterion sigma_f = Ftu (eq. 4.2.1) and the K criterion (eq. 4.2.2), not a net-section flow stress rule, so the formula itself is NASGRO's"},"RS-NET-BEND":{"id":"RS-NET-BEND","title":"Net-section bending of an asymmetric section (option crack.net_bending, 2.54)","equation":"Sn = S0 A_gross / A_net + kb, kb = bending stress at a fraction 0.13 of the section inside the edge; sigma_c = sigma_flow / (S0 / net + kb)","source":"NASGRO Appendix B","status":"P","check":"tests/test_nasgro_appb.py: TC02, TC03, TC04, CC01 and SC01 checked term by term against the printed formulas of pp. B-2, B-3, B-7 and B-14; CC02 (p. B-8) coded with the moment magnitudes; web/xcheck cases 'net bending ...': Python and JS engines agree","limits":"","note":"P: NASGRO prints every bending term with a positive distance, so bending always adds to Sn; damtol uses the magnitudes of the moments (the printed CC02 moment My0 is negative for a centred hole). Not available for two corner cracks at a hole (CC04 N = 2), the rod, the hole row, the stiffened panel and the user beta tables (axial term only, warned). Off by default: in a skin that is held in-plane by the surrounding structure the section cannot bend freely, so the axial term (DTDH 4.2) is the realistic one; the option gives NASGRO's conservative value. A run of a licensed NASGRO, which prints Sn, is the check still to do (docs/validasi_nasgro/Validasi_NASGRO_damtol.xlsx)"},"S-GUST-8861B":{"id":"S-GUST-8861B","title":"Continuous turbulence field parameters","equation":"P1, b1, P2, b2 per altitude band","source":"MILA8861B","status":"V","check":"tests/test_spectrum.py: every row of MIL-A-8861B(AS) Table III (climb/cruise/descent, and low level contour vertical and lateral) against the page image of the table (page 24, owner's copy, 2.44); the first transcription came from the specification text","limits":"0 to above 80,000 ft; US Navy specification, so confirm applicability to your programme. The lateral low level row goes with a lateral gust response A-bar only. The scale of turbulence L of the table (500 ft up to 1000 ft, 1750 ft to 2500 ft, 2500 ft above) is not used by damtol; a dynamic A-bar must use it","note":""},"S-GUST-N0":{"id":"S-GUST-N0","title":"Default characteristic frequency N0","equation":"N01 = 10 and N02 = 7.5 per mile","source":"AE4039","status":"U","check":"N0 must come from the dynamic analysis of your aircraft (MIL-A-8861B 3.5.2). Pass both n01 and n02 to remove this entry; one alone keeps it, since the other is still the example value (F-19)","limits":"","note":""},"S-GUST-PSD":{"id":"S-GUST-PSD","title":"PSD mission-analysis gust exceedance","equation":"N(dg) = T [N01 P1 exp(-dg/(b1 A)) + N02 P2 exp(-dg/(b2 A))]","source":"AFRL3030 Appendix C4.1.4 and Table C18","status":"P","check":"form, N0 = 10.0 and 7.5 and the P and b table of RAPID (AFRL-VA-WP-TR-2000-3030) section C4.1.4 and Table C18, p. C-24 and C-25; the AE4039 legacy table is Table C18 row by row (tests/test_spectrum.py, traced in the 2.48 audit; until then U with 'origin could not be traced'). RAPID takes them from its reference 6. P: a generic transport basis, not your programme's; MIL-A-8861B Table III is the default","limits":"","note":""},"S-SEQ":{"id":"S-SEQ","title":"Flight-by-flight load sequence","equation":"occurrences of a dg band at its centre (exceedances at dg -/+ step/2); cycles drawn at random from pools, each used once; gust and symmetric manoeuvre cycles 1 g +/- dg, the up or down manoeuvre excursions left over paired with 1 g as half cycles; airborne order gust, symmetric, unsymmetric; taxi and landing about the 1 g ground stress; one ground point before and after the flight","source":"AFRL3030 Appendix C4.2","status":"P","check":"tests/test_spectrum.py (2.48): cycles survive as pairs, band centres, manoeuvre pairing and the rounding half up of both engines. F-65 to F-69 (2.48): until 2.47 the points were shuffled one by one (24 % too long a life), bands sat at their lower edge (22 %), every manoeuvre event made a full cycle, a copy of the flight's peak was added and the life was per n_flights, not per generated flight. P: RAPID does not say at which level a band is placed; damtol uses the centre","limits":"manoeuvre tables are read log-linearly at the band edges, with the first value below the first row and nothing above the last","note":""},"S-NZ-STRESS":{"id":"S-NZ-STRESS","title":"Load factor to stress at the crack location (fixed wing)","equation":"airborne sigma = sigma_1g + (sigma_1.5g - sigma_1g) / 0.5 * dn (+ sigma_dP); taxi sigma = sigma_taxi (1 +/- dn); landing sigma = sigma_taxi +/- (MPa per g) * dn","source":"AFRL3030 Appendix C6 eq. (C1)","status":"P","check":"2.54.4: RAPID eq. (C1), p. C-33, sigma = sigma_p + (1 +/- dg) sigma_1g (read in the OCR text of the project PDF, a scanned report; the page image was not viewed). damtol's two-point line is (C1) when sigma_1.5g = 1.5 sigma_1g (tests/test_spectrum.py); with other values it allows a stress at 0 g that is not zero","limits":"","note":"P: the two-point line and the taxi and landing forms are damtol's (AE4039 input layout). sigma_1g and sigma_1.5g must come from the stress analysis of the 1 g and 1.5 g cases: the life goes with stress to the power 3 to 4. RAPID eq. (C2) gives the design limit stress as the pressure term plus DLF sigma_1g (DLF 2.5, 14 CFR 25.337(b)); damtol does not use it"},"S-GUST-K":{"id":"S-GUST-K","title":"Gust alleviation factor","equation":"K = 0.5 (W/S)^0.25 for W/S <= 16, else 1.333 - 2.667/(W/S)^0.75","source":"AE4039 eq 3.3","status":"U","check":"pre-1953 CAR expression; not the current Part 23/25 Kg. Give each mission its own A-bar (response per unit gust velocity) from your loads group and this model is not used","limits":"","note":"Superseded by S-GUST-ABAR when A-bar is supplied"},"S-GUST-ABAR":{"id":"S-GUST-ABAR","title":"Gust response per unit turbulence, A-bar","equation":"A = response (g) per ft/s of gust velocity, supplied per mission","source":"user","status":"P","check":"removes the alleviation factor and the wing-loading formula from the chain; the value must come from the dynamic analysis of your aircraft (MIL-A-8861B 3.5.2)","limits":"","note":""},"S-CLIP":{"id":"S-CLIP","title":"High-load clipping","equation":"smax' = min(smax, S_clip), smin' = min(smin, S_clip); cycle order kept","source":"AC25571 section 8b(6)","status":"P","check":"tests/test_growth.py: clipped peaks, unchanged cycles below the level, and a shorter life with retardation, because the clipped overloads no longer retard growth; the critical size stays set by the unclipped peak (tests/test_growth.py and cross-check case 'clipping, peak governs a_crit')","limits":"","note":"the AC names clipping for test spectra; the clip level is the applicant's and must be justified. Without retardation clipping only removes damage"},"S-PRESS":{"id":"S-PRESS","title":"Cabin pressurization cycle","equation":"sigma_air = sigma_flight + sigma_dP on every airborne point; ground, taxi and landing unchanged, so each ground-air-ground cycle carries the normal operating dP","source":"AC25571 section 5b","status":"P","check":"tests/test_spectrum.py: every point moves by exactly 0 or sigma_dP, taxi, landing and ground points stay put, the peak rises by sigma_dP; cross-check case 'fixed wing with pressurization'","limits":"","note":"sigma_dP per mission is user input (stress at the crack location for the normal operating differential pressure); the superposition follows AC 25.571-1D 5b, the value does not"},"S-TAXI":{"id":"S-TAXI","title":"Runway roughness occurrences","equation":"times per 1000 runway landings that nz = 1 +/- dg is experienced","source":"MILA8866C","status":"V","check":"tests/test_spectrum.py: every row transcribed from MIL-A-8866C(AS) Table II","limits":"US Navy specification: confirm applicability to your programme and runway","note":""},"S-LAND":{"id":"S-LAND","title":"Landing sink speed occurrences","equation":"distribution of sinking speeds per 1000 landings","source":"MILA8866C","status":"V","check":"tests/test_spectrum.py: field flared column transcribed from MIL-A-8866C(AS) Table I; the carrier column was misaligned by one row in v1 and is corrected in v2.3","limits":"US Navy data. The carrier column is in multiples of sigma, not fps: since 2.48 (F-70) it is not offered as a preset (spectrum.LANDING_CARRIER_SIGMA), convert it to fps first","note":""},"S-MAN":{"id":"S-MAN","title":"Manoeuvre exceedance","equation":"cumulative exceedances per 1000 flight hours, up and down manoeuvres","source":"AFRL3030","status":"V","check":"tests/test_nasgro_manual.py: every row of Table C5 in Appendix C of AFRL-VA-WP-TR-2000-3030, for cruise and for climb/descent, both signs","limits":"generic transport data derived from more than 3600 hours of airline operations (NASA TN D-4330 and TN D-1801); it is not a programme spectrum","note":"Down manoeuvres are generated as valleys since v2.16; with the earlier up-only table the example transport life was 0.4 % longer"},"S-HELI-DEF":{"id":"S-HELI-DEF","title":"Default rotorcraft usage spectrum","equation":"placeholder values","source":"damtol","status":"U","check":"format example only; 14 CFR 29.571(e)(1) requires in-flight measurements","limits":"","note":""},"S-MEASURED":{"id":"S-MEASURED","title":"Measured stress history","equation":"rainflow of the recorded signal","source":"ASTME1049","status":"V","check":"tests/test_rainflow.py: rainflow identical to ASTM E1049 and the rainflow package on 200 series","limits":"","note":""},"Q-JSSG-FLAW":{"id":"Q-JSSG-FLAW","title":"JSSG-2006 initial flaw sizes","equation":"holes: 0.05 in corner (t > 0.05) or through; other: 0.125 x 0.25 in surface","source":"DTDH 1.3 Table 1.3.2","status":"V","check":"tests/test_compliance.py: initial flaw sizes of Table 1.3.2","limits":"","note":""},"Q-JSSG-INSP":{"id":"Q-JSSG-INSP","title":"JSSG-2006 in-service flaw sizes","equation":"DTDH Table 1.3.3","source":"DTDH 1.3 Table 1.3.3","status":"V","check":"tests/test_compliance.py: in-service flaw sizes of Table 1.3.3","limits":"","note":""},"Q-JSSG-PXX":{"id":"Q-JSSG-PXX","title":"JSSG-2006 residual strength load Pxx","equation":"load exceeded once in M x interval; >= DLL; need not exceed 1.2 x max lifetime
