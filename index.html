interval = L(a_det to a_crit at limit load) / N; Crack Growth Retirement: retirement = L(BEC to a_crit) / N, no growth -> retirement <= design service life; N >= 2 top-of-scatter da/dN, 4 average da/dN or one test specimen, 3 shortest of two or more full-scale tests; first inspection at the repeat interval unless substantiated; typical BEC 0.380 mm semicircular surface crack (precision-machined mechanical parts), 1.270 mm quarter-circular corner crack at fastener holes (aluminium airframe)","source":"AC29571B f.(5)(iii)(E), f.(7)(iv)(B) to (E), f.(8), f.(8)(ii)(A) and (C)","status":"V","check":"tests/test_requirements.py: N per data basis, interval check, first inspection at the interval and retirement = life / N. 2.52: compared with the final AC 29-2C Change 4 text (pp. C-113 to C-128): BEC sizes, retirement = (L1 + L2) / N or L_T / N, no growth -> design service life, N = 2, 4, 4 or 3 (the same values for retirement and inspection), first inspection at the repeat interval unless substantiated; all as in the NPA 2010-06 draft used before","limits":"","note":"the default basis is average data (N = 4), because the FAA library constants are fits to the data trend, not upper bounds"},"Q-3063":{"id":"Q-3063","title":"MIL-STD-3063 reliability basis","equation":"reliability and confidence from the system specification; 15-50% separation between steady high-frequency loads and working endurance limit","source":"MILSTD3063 5.1.2, 6.4.12.2","status":"V","check":"tests/test_requirements.py: basis text and the 5.1.2 reliability reference","limits":"","note":""},"I-POD":{"id":"I-POD","title":"Cumulative probability of detection","equation":"P_miss = prod(1 - POD(a_k)), POD log-normal in crack size","source":"damtol","status":"P","check":"log-odds and log-normal POD forms are standard (MIL-HDBK-1823); parameters are yours","limits":"","note":""},"F-MINER":{"id":"F-MINER","title":"Palmgren-Miner linear damage","equation":"D = sum n_i / N_i, life = 1 / D per block","source":"SHIGLEY10 eq. (6-58)","status":"V","check":"tests/test_fatigue.py: damage summed by hand for a two-level spectrum. 2.54.2: source corrected; DTDH 2.1, cited until 2.54.1, is about crack growth damage concepts and has no Miner rule (read 22 Oct 2026)","limits":"","note":""},"F-BASQUIN":{"id":"F-BASQUIN","title":"Basquin S-N curve with mean-stress correction","equation":"N = N_ref (S_ref / S_eq)^k; S_eq from Goodman, Walker or SWT","source":"SHIGLEY10 eqs (6-13) to (6-16), (6-46) and Example 6-12","status":"P","check":"2.54.2: the power law N = (S_rev / a)^(1/b) is Shigley eqs (6-13) to (6-16) p. 293, the Goodman equivalent S_rev = S_a / (1 - S_m / S_ut) is Shigley Example 6-12 p. 322 from eq. (6-46); both read directly. DTDH 2.1, cited until 2.54.1, has no S-N curve","limits":"","note":"P: the Walker and Smith-Watson-Topper equivalents are standard forms not yet read in a source in the project, and the curve constants are the user's"},"F-MIL5":{"id":"F-MIL5","title":"MIL-HDBK-5 / MMPDS equivalent stress S-N model","equation":"S_eq = Smax (1 - R)^A3, log10 Nf = A1 + A2 log10(S_eq - A4)","source":"MILHDBK5","status":"P","check":"tests/test_fatigue.py: the model reproduces the quoted 2024-T3 Kt 1.5 equation point by point. The equation form is the published MIL-HDBK-5 form; the coefficients are yours","limits":"","note":""},"F-GOODMAN":{"id":"F-GOODMAN","title":"Goodman infinite-life check (one maximum/minimum pair)","equation":"fastener: n = Kf (S_alt / S_e + S_mean / S_u); coarse-model stress: n = S_alt / S_e(Kt) + S_mean / S_u; S_alt = LVF |S_max - S_min| / 2, S_mean = (S_max + S_min) / 2, a compressive S_mean taken as 0 (no credit, since 2.48, F-75; also in the lug check); OK when n <= 1","source":"SHIGLEY10 eqs (6-36), (6-46); 6-11, 6-12","status":"V","check":"tests/test_goodman.py: hand calculation of both forms, and the owner's DFEM spreadsheet (12 rows) and report tables reproduced to the printed digits (check kept outside the package, the data are company sensitive). 2.52, Shigley read directly: S_mean and S_alt eq. (6-36), Kf on both components (p. 310), modified Goodman eq. (6-46) with n here the inverse of the factor of safety, and no fatigue benefit from a compressive midrange (p. 313). The coarse-model form (S_e at the notch, Kt not applied again) and the LVF are the owner's practice, not Shigley; S_e, S_u, q and LVF are yours","limits":"constant amplitude, infinite life only: no life in cycles and no damage sum","note":""},"F-KF":{"id":"F-KF","title":"Fatigue notch factor from notch sensitivity","equation":"Kf = 1 + q (Kt - 1), Kt1 = max(Kt, kt_min)","source":"SHIGLEY10 eq. (6-32)","status":"V","check":"tests/test_goodman.py: hand values. Shigley 10th ed. eq. (6-32) p. 303 read directly (2.52). Kt1 = max(Kt, kt_min) is the owner's floor, not Shigley. q is yours (material and notch radius; Shigley Fig. 6-20 or eqs (6-34), (6-35))","limits":"","note":""},"F-KT-BYP":{"id":"F-KT-BYP","title":"Open eccentric hole, net-section Kt (bypass)","equation":"Kt = C1 + C2 (a/c) + C3 (a/c)^2; C1 = 2.989 - 0.0064 (c/e), C2 = -2.872 + 0.095 (c/e), C3 = 2.348 + 0.196 (c/e); a = D/2, c the shorter and e = W - c the longer distance to the edges","source":"PETERSON2 Chart 4.3, eq. (4.14)","status":"V","check":"tests/test_goodman.py: C1, C2, C3 and the nominal stress are those printed on Peterson 2nd ed. Chart 4.3 (p. 258, read directly in 2.52; the owner's report Fig. 3-10 shows the same chart), the centred limit (c = e) agrees with the centred-hole formula Ktn = 2 + 0.284 (1 - d/H) - 0.600 (1 - d/H)^2 + 1.32 (1 - d/H)^3 within 1 % up to d/H = 0.3, and the owner's spreadsheet is reproduced. 2.48 audit (F-73): the eccentric-hole charts define Kt on the nominal stress sigma_nA = sigma_gross sqrt(1 - (a/c)^2)/(1 - a/c) (1 - c/W)/(1 - (c/W)(2 - sqrt(1 - (a/c)^2))) (Roark Table 6.1 case 3a, from Peterson), equal to the net-section stress only for a centred hole; the report and the default byp_nominal = net multiply Kt by F/((W - D) t), byp_nominal = peterson by sigma_nA; both are reported (tests/test_goodman.py)","limits":"0 <= a/c <= 0.5, 0 <= c/e <= 1 (a warning is given above a/c 0.5); c larger than e is swapped (F-74)","note":""},"F-KT-BRG":{"id":"F-KT-BRG","title":"Pin-loaded hole, net-section Kt (bearing), cubic fit","equation":"Kt = 12.882 - 52.714 (D/W) + 89.762 (D/W)^2 - 51.667 (D/W)^3","source":"PETERSON2 4.5.8, Chart 4.67","status":"P","check":"tests/test_goodman.py: the equation is the one printed on the Peterson pin-joint chart (Ktnd, net section, closely fitting pin), as reproduced in the owner's report (Fig. 3-11), and reproduces the owner's spreadsheet. 2.52: the definition Ktnd = sigma_max (H - d) h / P (eq. 4.83) and the chart condition c/H >= 1 were read in Peterson 2nd ed. section 4.5.8; Chart 4.67 itself is not in the owner's copy. Cross-check: Niu Fig. 9.12.12 (Ktb on the bearing stress dP/(D t)), digitized and converted with Ktnd = Ktb (W/D - 1) (as eq. 4.85), is within 1 % of the cubic for D/W 0.38 to 0.52; for D/W 0.15 to 0.35 the cubic is 3 to 10 % higher (conservative). P until Chart 4.67 is seen","limits":"0.15 <= D/W <= 0.75 and edge distance in the load direction >= W (chart conditions); a warning is given outside the D/W range, where the cubic is an extrapolation","note":""},"F-THETA":{"id":"F-THETA","title":"Bearing distribution factor theta, cubic fits in t/D","equation":"single shear: -0.0774 x^3 + 0.5647 x^2 + 0.4507 x + 1.1496; double shear: -0.0026 x^3 + 0.0367 x^2 + 0.1758 x + 0.9943; x = t/D","source":"NIU1997 Fig. 9.12.13","status":"V","check":"tests/test_goodman.py: the fits reproduce the owner's spreadsheet and points digitized from Niu Fig. 9.12.13 (2.52, read from the figure): within 2.1 % for single shear t/D 0.25 to 3.25 and within 2.8 % for double shear t/D 0.25 to 6.9 (largest near t/D 0.25, where the curves meet the axis)","limits":"single shear t/D up to 3.7, double shear up to 7.3 (end of the drawn curves, approximate); a warning is given beyond, where the single-shear cubic turns over and would be unconservative","note":""},"F-COMPOUND":{"id":"F-COMPOUND","title":"Compounding of bearing and bypass Kt at a fastener hole","equation":"bypass governs (S_byp >= S_brg): Kt = Kt_byp + alpha beta theta Kt_brg S_brg / S_byp; bearing governs: Kt = Kt_brg (spreadsheet branch) or Kt = alpha beta theta Kt_brg + Kt_byp S_byp / S_brg (consistent branch); stresses on the net section (W - D) t","source":"NIU1997 eq. 9.12.3","status":"P","check":"tests/test_goodman.py: both branches by hand; the bypass branch is eq. 3-19 of the owner's report, the spreadsheet branch reproduces the owner's 12 rows. P: the report gives only eq. 3-19 (divided by S_byp); the bearing-governed branch of the spreadsheet was inferred from its numbers. 2.52, Niu read directly: eq. 9.12.3 is SF = (alpha beta / sigma) [theta Ktb dP / (D t) + Ktg P / (W t)], so alpha beta also multiplies the bypass term; on the same reference stress Niu gives alpha beta (Kt_byp + theta Kt_brg S_brg / S_byp), lower than damtol's bypass branch by (1 - alpha beta) Kt_byp (damtol conservative when alpha beta < 1, equal when it is 1). Each Kt is paired with its own nominal stress, so the net-section Peterson factors give the same peak terms as Niu's Ktb and Ktg. The defaults alpha 1.0 (standard drilled hole) and beta 0.75 (rivets, Hi-Lok) are values of Niu p. 382","limits":"","note":"the spreadsheet branch drops theta, alpha beta and the bypass term when bearing governs; damtol reports the consistent value next to it and warns when only the spreadsheet branch passes"},"F-HEYWOOD":{"id":"F-HEYWOOD","title":"Lug fatigue check against lug test data with the Heywood correction","equation":"S_eq(R=-1) = S_u S_alt / (S_u - S_mean); S_eq,hey = S_eq Kt_c (d_c + 25.4) / (Kt_test (d_test + 25.4)); S_max(R=0.1) = S_u S_eq,hey / (0.55 S_eq,hey + 0.45 LVF S_u); n = S_max(R=0.1) / S_allow(R=0.1)","source":"HEYWOOD1962","status":"P","check":"tests/test_goodman.py: hand calculation of every step; the equations are eqs 3-5 to 3-16 of the owner's fatigue report. P: Heywood (1962) is not in the project library; the allowable, Kt and diameter of the test lug are yours","limits":"S_mean < S_u; the test data must be at R = 0.1 and the same life as the requirement","note":"eq. 3-14 applies the load variability factor to the R = 0.1 cycle compared with the allowable, which lowers that cycle by about LVF^2 against the factor on the applied stress; both are reported (heywood_lvf = report or applied)"},"F-SN-EXAMPLE":{"id":"F-SN-EXAMPLE","title":"Example S-N coefficients","equation":"built-in example curve","source":"user","status":"U","check":"the Basquin default and the 2024-T3 Kt 1.5 set are examples. The MIL-HDBK-5 set is a secondary quote. Use the curve for your alloy, product form and Kt","limits":"","note":""}},"references":{"TM87594":"Raju, I.S. & Newman, J.C. Jr. (1985). Stress-intensity factors for circumferential surface cracks in pipes and rods under tension and bending loads. NASA TM-87594 (also ASTM STP 905, 1986). Table 3.","TP1578":"Newman, J.C. Jr. & Raju, I.S. (1979). Analyses of Surface Cracks in Finite Plates Under Tension or Bending Loads. NASA TP-1578. Table I: finite-element stress-intensity factors used as the check of B-SURF in tension and bending. ntrs.nasa.gov/citations/19800005257","MMPDS16":"Metallic Materials Properties Development and Standardization (MMPDS-16), Battelle, 2021. Chapter 3 design mechanical property tables of 2014, 2024, 7050, 7075 and 7475 (owner's licensed copy).","NASA5009C":"NASA-STD-5009C, Nondestructive Evaluation Requirements for Fracture-Critical Metallic Components (2023-08-03), Table 1 (mm) and Table 2 (in): reliably detectable flaw sizes for Standard NDE, 90/95 POD. Same values as the 2008 baseline NASA-STD-5009, which superseded MSFC-STD-1249. standards.nasa.gov, public release.","POE1971":"Poe, C.C. Jr. (1971). Stress-intensity factor for a cracked sheet with riveted and uniformly spaced stringers. NASA TR R-358 (public, ntrs.nasa.gov 19710016458). Method in appendix A.","BROEK1986":"Broek, D. (1986). Elementary Engineering Fracture Mechanics, 4th ed., Martinus Nijhoff. Chapter 16 (stiffened sheet structures), section 3.3 (Westergaard), section 14.6 (mixed mode).","TM85793":"Newman, J.C. Jr. & Raju, I.S. (1984). Stress-intensity factor equations for cracks in three-dimensional finite bodies subjected to tension and bending loads. NASA TM-85793. ntrs.nasa.gov/citations/19840015857","DTDH":"USAF Damage Tolerant Design Handbook (Guidelines for the Analysis and Design of Damage Tolerant Aircraft Structures), hosted at afgrow.net/applications/DTDHandbook. Sections cited as DTDH x.y. Owner's copy: AFGROW_Full_PDF.pdf (19.4 MB, text PDF, Google Drive), the same handbook as the section files Sec1_0 to Sec11_6 (VALIDATION 1b); it is the handbook, not the AFGROW software manual. Sections 2.1, 4.2, 5.1 and 11.3 read again from the section files on 22 Oct 2026 (VALIDATION 1ag).","FAA0515":"Skinn, D.A. et al. Fatigue Crack Growth Database for Damage Tolerance Analysis. DOT/FAA/AR-05/15, FAA Office of Aviation Research.","CFR25":"14 CFR Part 25, current as of 14 Sep 2026, section 25.571.","CFR29":"14 CFR Part 29, current as of 14 Sep 2026, section 29.571 (Amdt. 29-55).","AC29571B":"FAA AC 29-2C, Certification of Transport Category Rotorcraft, Change 4 (5/1/2014), section AC 29.571B Fatigue Tolerance Evaluation of Metallic Structure (pages dated 12/2/2011, unchanged up to Change 9 of 6/23/2023). Read directly in the owner's copy with Changes 1-9 (2.52): f.(5)(iii)(E) pp. C-113 and C-114, f.(7)(iv) pp. C-118 to C-121, f.(8) pp. C-122, C-123 and C-128. Until 2.51 the tool followed the harmonised draft of EASA NPA 2010-06 (27 May 2010), Proposal 2; the final text agrees with it on every point used.","AC25571":"FAA AC 25.571-1D, Damage Tolerance and Fatigue Evaluation of Structure (2011).","JSSG2006":"JSSG-2006 as summarised in DTDH Section 1.3 (Tables 1.3.1 to 1.3.6).","MILSTD3063":"MIL-STD-3063, Rotorcraft Structural Integrity Program (RSIP).","ASTME1049":"ASTM E1049-85 (2017), Standard Practices for Cycle Counting in Fatigue Analysis.","VIRKLER":"Virkler, D.A., Hillberry, B.M. & Goel, P.K. (1979). The statistical nature of fatigue crack propagation. J. Eng. Mater. Technol. 101:148. Digitised curves from Bogdanoff & Kozin (1985) Fig. 4.5.3, github.com/WarrRich/Virkler-Data (CC0).","AE4039":"Nurrahman, M.L. (2021). Laporan Tugas Besar Damtol AE4039, ITB.","ABDULLAH2011":"Abdullah, S., Beden, S.M. & Ariffin, A.K. (2011). Fatigue Crack Growth Simulation of Aluminium Alloy under Cyclic Sequence Effects. In Aluminium Alloys, Theory and Applications, InTech, pp. 237-258, doi:10.5772/14898. Table 4: 2024-T3 properties from ASM handbooks.","AFWAL8603":"Kuo, A., Yasgur, D. & Levy, M. (1986). Assessment of Damage Tolerance Requirements and Analyses, Task I Report, Vol. II: Analytical Methods. AFWAL-TR-86-3003 Vol. II, Fairchild Republic, DTIC ADA170327 (public release; copy at archive.org DTIC_ADA170327). Compounding eq. 23a, crack at a hole eq. 24 (Brussat fit of Tweed and Rooke), two unequal cracks eqs 26 to 28, finite width of an eccentric crack eqs 66a and 66b with Tables 4 and 5 (Isida), crack approaching a hole eqs 69a to 69c with Table 6. Read from the page images.","GALATOLO":"Galatolo, R. & Lazzeri, R. (2017). Fatigue crack growth of multiple interacting cracks: analytical models and experimental validation. Fatigue Fract Eng Mater Struct, doi 10.1111/ffe.12671. Also gives C = 7.32e-8 (mm/cycle, MPa sqrt(m)), m = 2.986 for 2024-T3 clad, t 1.6 mm, R 0.1.","TADA":"Tada, H., Paris, P.C. & Irwin, G.R. The Stress Analysis of Cracks Handbook, 3rd ed., ASME Press. Excerpts in the project files: sections 2.1 to 2.2, 2.6 to 2.11, 19.1, 19.2, 19.4, 19.15.","DSTO9405":"Pickthall, C.R. (1994). Stress Intensity Factors and Crack Mouth Openings for Bridged Cracks Emanating from Circular Holes. DSTO-RR-0005, Aeronautical and Maritime Research Laboratory, Melbourne. Appendix A.2: numerical F for one and two cracks at a hole (F = sqrt(s_F) as ka -> 0). DTIC ADA291131, approved for public release.","TM101544":"Newman, J.C. Jr. & Dawicke, D.S. (1989). Prediction of Fatigue-Crack Growth in a High-Strength Aluminum Alloy under Variable-Amplitude Loading. NASA TM-101544 (ntrs.nasa.gov 19890012764). Specimens of Zhang et al. (1987): w = 80 mm, t = 8 mm, Table 1: initial half-crack ci = 4 mm for load types 1 to 8, test lives, linear-damage (from Zhang et al.) and closure-model predictions; eq. 1: Zhang's dKeff-rate law of the batch.","NEWMAN1971":"Newman, J.C. Jr. (1971). An Improved Method of Collocation for the Stress Analysis of Cracked Plates with Various Shaped Boundaries. NASA TN D-6376. Table I: two cracks at a circular hole.","MILA8866C":"MIL-A-8866C(AS) (1987), Tables I and II.","MILA8861B":"MIL-A-8861B(AS) (7 Feb 1986), Airplane Strength and Rigidity, Flight Loads, Table III, Turbulence field parameters.","AFRL3030":"AFRL-VA-WP-TR-2000-3030, Enhancements to Repair Assessment Procedure and Integrated Design (RAPID), Chen, Nomura & Yu, The Boeing Company. Generic load and stress spectra are in Appendix C. DTIC ADA416231.","NASGRO":"NASGRO Fracture Mechanics and Fatigue Crack Growth Analysis Software, Reference Manual, version 4.02, NASA JSC and SwRI, September 2002, read in full: equations 2.3 to 2.7 and 2.11 to 2.13, section 2.1.3 (Cth), sections 2.1.6 and 2.2.2 (Table 6b, transition of crack cases) and Table 8 (standard NDE flaw sizes; the NDT list used it until 2.38 and follows NASA-STD-5009C since 2.39, F-38). Appendices B (net-section stress, pp. B-1 to B-10, B-13, B-14), C (TC04 and common symbols, pp. C-1, C-5) and F (interpolation, pp. F-1 to F-5) read on 22 Oct 2026 from the Docs folder of the owner's NASGRO 4.0 installation (government edition, whose program use is limited to NASA, ESA and FAA staff, their contractors and FAA DERs: the program was not used and the installation was removed). Equation forms also used by DOT/FAA/AR-05/15. Public excerpt: NASGRO Manual, Fatigue Crack Growth Analysis (NASFLA), August 2022, swri.org. (Key NASGRO402 merged into NASGRO in 2.49.)","MEGCAS2003":"Meggiolaro, M.A. & Castro, J.T.P. (2003). Modeling surface flaw transition to a through crack. COBEM 2003, paper 0274.","LIUCHU2014":"Liu, C.H. & Chu, S.J. (2014). Prediction of shape change of semi-elliptical surface crack by fatigue crack growth circles. J Mech Sci Technol 28(12), 4921-4928. Table 2 gives finite element K along the front; Fig 10 compares shape change with the Putra & Schijve tests on 7075-T6.","PETERSON2":"Pilkey, W.D. (1997). Peterson's Stress Concentration Factors, 2nd ed., Wiley. Read directly in the owner's copy (2.52): section 4.3.1 eq. (4.14) p. 184 and Chart 4.3 p. 258 (eccentric hole, after Sjostrom 1950), section 4.5.8 eqs (4.83) to (4.85) p. 230 (round pin joint, closely fitting pin). The copy ends the chapter 4 charts at Chart 4.24, so Chart 4.67 (pin joint) was not seen. The 3rd ed. (2008) was not read.","NIU1997":"Niu, M.C.Y. (1997). Airframe Stress Analysis and Sizing, Conmilit Press. Fatigue of fastened joints, read directly in the owner's copy (2.52): section 9.12 (D), eq. 9.12.3 with the hole condition factor alpha and hole filling factor beta p. 382, Figs 9.12.11 to 9.12.13 pp. 383-384.","HEYWOOD1962":"Heywood, R.B. (1962). Designing Against Fatigue, Chapman and Hall. Size and notch correction of lug fatigue strength (constant 25.4 mm), as used in the owner's fatigue report (eqs 3-5 to 3-16).","SHIGLEY10":"Budynas, R.G. & Nisbett, J.K. (2015). Shigley's Mechanical Engineering Design, 10th ed., McGraw-Hill. Read directly in the owner's copy (2.52): section 6-10 eqs (6-31), (6-32) p. 303; section 6-11 eq. (6-36) p. 309 and Kf on both stress components p. 310; section 6-12 p. 313 (compressive midrange) and eqs (6-41), (6-46) p. 314. 2.54.2: eqs (6-13) to (6-16) p. 293, Example 6-12 p. 322 and eq. (6-58) p. 331.","MILHDBK5":"MIL-HDBK-5J (2003), Metallic Materials and Elements for Aerospace Vehicle Structures, fatigue data presented with the equivalent stress equation; the same form is used by its successor MMPDS.","CHERRY1997":"Cherry, M.C., Mall, S., Heinimann, B. & Grandt, A.F. (1997). Residual strength of unstiffened aluminum panels with multiple site damage. Eng Fract Mech 57(6), 701-713. Eqs 1 to 7 (net section, Swift ligament yield with R = (1/2 pi)(K/sigma_ys)^2, width terms), Fig. 5 (Kamei-Yokobori interaction of two collinear cracks), eq. 6 (Grandt fit of the Bowie factor), Tables 1 to 5 (13 panels: cracks per hole, measured and predicted loads; transcribed in tests/data/cherry1997.json from the page images, owner's copy in Google Drive).","MAKOBA2000":"Ma, L., Kobayashi, A.S., Atluri, S.N. & Tan, P.W. (2000). Crack Linkup by Stable Crack Growth. CMES 1(4), 19-26, FAA grant 91-G-0005. States Swift's plastic-zone link-up criterion (Swift 1985, 1992, 1994) with rp = (1/pi)(K/sigma_y)^2 (eq. 2) and compares it with the MSD2, MSD3 and MSD5 tests (Table 2). Open access: techscience.com/CMES/v1n4/24705.","AR951":"DOT/FAA/AR-95/1 (1996). Fracture Testing of Large-Scale Thin-Sheet Aluminum Alloy, FAA Technical Center / NIST. Ten 2286 mm wide bare 2024-T3 panels, 1.016 mm; Table 1 (central crack and MSD geometry), Table 3 (measured first and second link-up and fracture stresses, Broek's plastic-zone and R-curve predictions); transcribed in tests/data/ar95_1.json from the page images.","SWRI2006":"Cardinal, J.W., Feiger, J.H. & McKeighan, P.C. (2006). Fatigue Crack Growth Equations for TC-128B Tank Car Steel. SwRI for US DOT Volpe Center, rosap.ntl.bts.gov/view/dot/8998."},"tiers":{"1":["Rules","Aturan","what has to be shown","apa yang harus dibuktikan"],"2":["Primary formula sources","Sumber rumus primer","the source a formula is taken from","sumber tempat rumus diambil"],"3":["Supporting","Pendukung","used only where tier 2 has no answer; the entry says why","dipakai hanya bila tier 2 tidak mencakup; alasannya ada di entri reg A4":23.7,"units":"ksi","note":"quoted from MIL-HDBK-5 in a secondary source; check against the MIL-HDBK-5J or MMPDS figure for 2024-T3 sheet at Kt = 1.5 before use"}},"neutral_case":{"project":{"name":"","part":"","analyst":"","basis":"FAR25","notes":""},"mode":"study","waivers":{},"stress_scale":1.0,"truncation":0.0,"retardation":{"model":"none"},"solver":"auto","requirement":{},"inspections":[],"fatigue":{"enabled":false}},"advice_text":{"legacy-turbulence":["important","Tabel turbulensi warisan AE4039 dipakai. Tabel ini bukan MIL-A-8861B dan memberi umur sekitar 39 persen terlalu panjang (Rekaman Validasi, temuan F-9).","The legacy AE4039 turbulence table is in use. It is not MIL-A-8861B and gave a life about 39 % too long (validation record, finding F-9)."],"legacy-maneuver":["important","Tabel manuver hanya berisi manuver ke atas. Tabel C5 RAPID juga memuat manuver ke bawah.","The manoeuvre table has up manoeuvres only. Table C5 of the RAPID report also has down manoeuvres."],"paris-varying-r":["important","Hukum Paris tidak memperhitungkan R, padahal spektrum ini punya R yang bervariasi. NASGRO memperhitungkannya.","The Paris law ignores R, and this spectrum has varying R. NASGRO accounts for it."],"walker-7050-mmpds":["important","Fit Walker FAA untuk 7050-T7451 (juga dipakai hukum Paris) menumbuhkan retak lebih lambat daripada data tipikal MMPDS-16 Tabel 3.7.5.2.9(a) (R 0,1, L-T, udara lembap): laju MMPDS 1,1 sampai 1,6 kali lebih cepat pada \u0394K 7 sampai 20 ksi\u221ain. Fit NASGRO lebih dekat: laju MMPDS 0,98 sampai 1,12 kali lajunya, jadi belum konservatif di semua titik; untuk sertifikasi pakai data Anda sendiri atau faktor pada laju (Rekaman Validasi, temuan F-49 dan F-57).","The FAA Walker fit for 7050-T7451 (also used by the Paris law) grows cracks slower than the MMPDS-16 typical data of Table 3.7.5.2.9(a) (R 0.1, L-T, humid air): the MMPDS rates are 1.1 to 1.6 times faster at \u0394K 7 to 20 ksi\u221ain. The NASGRO fit is closer: the MMPDS rates are 0.98 to 1.12 times its rates, so it is not conservative everywhere either; for certification use your own data or a factor on the rate (validation record, findings F-49 and F-57)."],"hole-surface-point":["important","Retak sudut di lubang dihitung dengan bentuk tetap di titik permukaan. Di lubang, K terbesar ada di titik lubang (terdalam), sehingga titik permukaan memberi umur 1,3 sampai 2,5 kali umur 2 DOF (Rekaman Validasi 1aa, temuan F-50). Pakai titik terdalam atau 2 DOF.","The corner crack at a hole uses a fixed shape at the surface point. At a hole the largest K is at the bore (deepest) point, so the surface point gives 1.3 to 2.5 times the two-DOF life (validation record 1aa, finding F-50). Use the deepest point or two-DOF."],"hole-ae4039":["important","Solusi retak di lubang memakai varian laporan AE4039, yang memberi beta 5 sampai 8 persen terlalu rendah (Rekaman Validasi, temuan F-12).","The hole solution is the AE4039 report variant, which gives beta 5 to 8 % too low (validation record, finding F-12)."],"fixed-shape-shallow":["important","Bentuk retak dangkal (a/c di bawah 0,8) dibuat tetap. Asumsi ini sangat konservatif; model 2 DOF memberi bentuk yang sesuai uji.","A shallow crack shape (a/c below 0.8) is held fixed. This is very conservative; the 2-DOF model follows the tests."],"angles-classic":["info","Mode 2 DOF memakai sudut 90/0. Sudut 80/10 dari DTDH lebih dekat ke hasil uji (Rekaman Validasi, 2-DOF).","The 2-DOF option uses 90/0 degrees. The DTDH 80/10 angles are closer to the tests (validation record, 2-DOF)."],"net-section-off":["important","Cek net-section yield dimatikan. Tanpa cek itu, ukuran kritis bisa terlalu besar.","The net-section yield check is off. Without it the critical size can be too large."],"too-few-flights":["important","Jumlah flight yang dibangkitkan lebih kecil dari umur hasil hitungan, jadi gust langka kurang terwakili.","Fewer flights were generated than the computed life, so rare gusts are under-represented."],"gust-k-n0":["info","Faktor alleviation gust dan N0 masih nilai contoh. Isi A-bar, N01, dan N02 dari analisis dinamik kelompok loads.","The gust alleviation factor and N0 are still example values. Enter A-bar, N01 and N02 from the loads group's dynamic analysis."],"retardation-on":["info","Retardasi aktif. Parameternya harus dikalibrasi terhadap uji spektrum, dan hasilnya tidak boleh dipakai untuk memperpanjang interval tanpa kalibrasi itu.","Retardation is on. Its parameters must be calibrated against spectrum tests before the result is used to extend intervals."],"fatigue-example":["info","Kurva S-N fatigue masih contoh. Ganti dengan kurva MMPDS untuk paduan, bentuk produk, dan Kt yang sesuai.","The fatigue S-N curve is still an example. Replace it with the MMPDS curve for the right alloy, product form and Kt."]},"turbulence_ae4039":[[1,1.0,0.01,2.7,5.4],[2.5,0.7,0.0075,2.7,5.91],[5,0.48,0.005,2.7,6.79],[10,0.25,0.0021,2.7,7.3],[20,0.09,0.00055,2.27,7.3],[30,0.04,0.00023,1.84,6.93],[40,0.017,0.0002,1.46,4.89],[50,0.007,0.00025,1.35,3.58],[60,0.0031,0.00016,1.3,2.33],[70,0.0014,0.00012,0.81,1.24]],"ndt":{"Eddy current, corner crack at hole or edge, t > 1.905: c = 1.905 (0.075 in, NASA-STD-5009C)":1.905,"Eddy current, through crack at hole or edge, t <= 1.905: c = 2.54 (0.100 in, NASA-STD-5009C)":2.54,"Eddy current, surface crack a = c = 1.27: 2c = 2.54 (NASA-STD-5009C)":2.54,"Eddy current, shallow surface crack a = 0.51: 2c = 5.08 (NASA-STD-5009C)":5.08,"Penetrant, crack at hole or edge (corner t > 2.54, or through): c = 3.81 (0.150 in, NASA-STD-5009C)":3.81,"Penetrant, surface crack a = c = 1.905: 2c = 3.81 (NASA-STD-5009C)":3.81,"Penetrant, shallow surface crack a = 0.64: 2c = 6.35 (NASA-STD-5009C)":6.35,"Magnetic particle, crack at hole or edge: c = 6.35 (0.250 in, NASA-STD-5009C)":6.35,"Ultrasonic, surface crack a = c = 1.65, t >= 2.54: 2c = 3.30 (NASA-STD-5009C)":3.302,"Ultrasonic, embedded crack a = c = 0.99: 2c = 1.98 (NASA-STD-5009C)":1.9812,"JSSG-2006 in-service     const curves = new Map();

      if (s0 <= 0) return 0;

        const fc = crackCase({ geometry: makeGeometry({ model: "hole1", W: geo.W, D: geo.D }), material: mat, a0: s0,

      const end = (i) => ends[Math.min(i, ends.length - 1)], n = geo.n;

    if (!settled) trace.warn(`hole row: the life with grown MSD and continuing-damage cracks did not settle within ${HOLE_ROW_PASSES} passes; the last pass is shown`);

    const g3 = (x) => String(Number(x.toPrecision(3)));
    trace.warn(`hole row: MSD and continuing-damage cracks grown from ${geo.msd} and ${geo.cont} mm with the lead crack (DTDH 6.2.2): at the end of bay ${last + 1} the MSD crack ahead is ${g3(geo.flaws.msd_next[last])} mm`);
    return res;

    cen.setUint16(6, 20, true);

  end.setUint16(10, files.length, true);

const xesc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))

      `<xdr:to><xdr:col>${anchorCol + 9}</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${r0 + heightRows}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to>` +

function sheetXml(rows, withDrawing) {

      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name: "xl/workbook.xml", data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +

/* ------------------------------------------------------------------ svg -> png / jpeg */
const STYLE_PROPS = ["fill", "stroke", "stroke-width", "stroke-dasharray", "stroke-linejoin",
  "stroke-linecap", "opacity", "fill-opacity", "stroke-opacity", "font-family", "font-size",
  "font-weight", "text-anchor"];

function inlineStyles(src, dst) {
  const cs = getComputedStyle(src);
  let css = "";
  for (const p of STYLE_PROPS) {
    const v = cs.getPropertyValue(p);
    if (v) css += `${p}:${v};`;
  }
  dst.setAttribute("style", css);
  const a = src.children, b = dst.children;
  for (let i = 0; i < a.length; i++) inlineStyles(a[i], b[i]);
}

/** Rasterise an on-page <svg> element. type: "png" | "jpeg".
    title and legend are drawn onto the canvas, because in the page they are
    HTML around the chart rather than part of the SVG. */
function svgToBlob(svg, { scale = 2, type = "png", background = null, title = "", subtitle = "",
                          legend = [], font = "Barlow, Arial, sans-serif" } = {}) {
  const vb = (svg.getAttribute("viewBox") || "0 0 640 360").split(/\s+/).map(Number);
  const w = vb[2], h = vb[3];
  const clone = svg.cloneNode(true);
  inlineStyles(svg, clone);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  clone.setAttribute("width", w);
  clone.setAttribute("height", h);
  const bg = background || getComputedStyle(document.body).backgroundColor || "#ffffff";
  const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  rect.setAttribute("x", vb[0]); rect.setAttribute("y", vb[1]);
  rect.setAttribute("width", w); rect.setAttribute("height", h);
  rect.setAttribute("fill", bg);
  clone.insertBefore(rect, clone.firstChild);
  const ink = getComputedStyle(svg).getPropertyValue("color") ||
    getComputedStyle(document.body).getPropertyValue("color") || "#000";
  const muted = getComputedStyle(document.documentElement).getPropertyValue("--muted").trim() || ink;
  const padTop = (title ? 26 : 0) + (subtitle ? 15 : 0);
  const padBottom = legend.length ? 22 : 0;
  const xml = new XMLSerializer().serializeToString(clone);
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas");
      cv.width = Math.round(w * scale);
      cv.height = Math.round((h + padTop + padBottom) * scale);
      const ctx = cv.getContext("2d");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.scale(scale, scale);
      ctx.textBaseline = "alphabetic";
      if (title) {
        ctx.fillStyle = ink;
        ctx.font = `600 16px ${font}`;
        ctx.fillText(title, 12, 18);
      }
      if (subtitle) {
        ctx.fillStyle = muted;
        ctx.font = `12px ${font}`;
        ctx.fillText(subtitle, 12, (title ? 26 : 0) + 11);
      }
      ctx.drawImage(img, 0, padTop, w, h);
      if (legend.length) {
        let x = 12;
        const y = padTop + h + 14;
        ctx.font = `12px ${font}`;
        for (const it of legend) {
          ctx.strokeStyle = it.color; ctx.lineWidth = 3;
          if (it.dash) ctx.setLineDash([4, 3]); else ctx.setLineDash([]);
          ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.lineTo(x + 18, y - 4); ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = muted;
          ctx.fillText(it.label, x + 23, y);
          x += 23 + ctx.measureText(it.label).width + 18;
        }
      }

        type === "jpeg" ? "image/jpeg" : "image/png", type === "jpeg" ? 0.92 : undefined);
    };
    img.onerror = () => reject(new Error("the chart could not be rasterised"));
    img.src = url;
  });
}

function persist() { try { localStorage.setItem("damtol.case", JSON.stringify(state.case)); localStorage.setItem("damtol.lang", state.lang); localStorage.setItem("damtol.adv", JSON.stringify(state.adv)); } catch (e) {} }

// claude.ai keeps its storage across updates). It is completed like an opened case file, and only taken
// when its four main sections are objects; otherwise the example case is used.
const isObj = (v) => !!v && typeof v === "object" && !Array.isArray(v);
function storedCase(o) {
  if (!isObj(o) || o.schema !== DATA.example_case.schema) return null;
  if (!["spectrum", "material", "geometry", "crack"].every((k) => isObj(o[k]))) return null;
  const c = completeCase(o);
  return isObj(c.project) ? c : null;
}
function restore() {
  let l = null, a = null, c = null, raw = null;
  try { l = localStorage.getItem("damtol.lang"); } catch (e) {}
  try { a = JSON.parse(localStorage.getItem("damtol.adv") || "{}"); } catch (e) {}
  try { raw = localStorage.getItem("damtol.case"); } catch (e) {}
  try { c = storedCase(JSON.parse(raw || "null")); } catch (e) {}
  if (l === "en" || l === "id") state.lang = l;
  if (isObj(a)) state.adv = a;
  if (c) state.case = c;
  else if (raw) { forget(); return false; }   // a stored case was there but cannot be used: say so after drawing
  return true;
}
function forget() { try { ["damtol.case", "damtol.adv"].forEach((k) => localStorage.removeItem(k)); } catch (e) {} }

function rec() { return state.lang === "id" ? " (disarankan)" : " (recommended)"; }
function getPath(o, p) { return p.split(".").reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, p, v) {
  const ks = p.split("."); let a = o;
  for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null || typeof a[ks[i]] !== "object") a[ks[i]] = {}; a = a[ks[i]]; }
  a[ks[ks.length - 1]] = v;
}

const sci = (x) => {

function trIdRaw(s) {
  if (typeof s !== "string") return s;
  if (Object.prototype.hasOwnProperty.call(ID_FIXED, s)) return ID_FIXED[s];
  let o = s;
  for (const [re, rep] of ID_RULES) o = o.replace(re, rep);
  return o;
}
const trId = (s) => grp(state.lang === "id" ? trIdRaw(s) : s);
const trCell = (v) => (typeof v === "string" ? esc(trId(v)) : fmt(v));

// The equations shown come from the model registry (DATA.registry): the same entries the engine
// records in the traceability matrix, verified and locked by tests, so a card cannot drift from
// what is computed. The rows in front of them tie each symbol to the input that sets it.
// Section 0: the source hierarchy of the registry (damtol/trace.py TIERS, REF_TIER, SOURCE_GAPS). The primary
// source of each entry is computed in Python (trace.primary_source) and shipped in DATA.source_primary.

    node[parts[parts.length - 1]] = value;

    if (v && typeof v === "object" && !Array.isArray(v)) {
      Object.keys(v).forEach((k) => { v[k] = listify(v[k]); });
      const ks = Object.keys(v);
      if (ks.length && ks.every((k) => /^\d+$/.test(k)) && ks.map(Number).sort((a, b) => a - b).every((x, j) => x === j))

  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= 6);

function selfTest() {
  const out = [];
  const add = (name, ref, pass, detail) => out.push({ name, ref, pass: !!pass, detail });
  // rainflow
  const rf = E.rainflow([-2, 1, -3, 5, -1, 3, -4, 4, -2]).cycles, agg = {};
  rf.forEach(([r, m, c]) => (agg[r] = (agg[r] || 0) + c));
  add("Rainflow, ASTM E1049 example", "ASTM E1049", JSON.stringify(agg) === JSON.stringify({ 3: 0.5, 4: 1.5, 6: 0.5, 8: 1, 9: 0.5 }), JSON.stringify(agg));
  // paris closed form
  const pm = { name: "p", law: "paris", C: 1e-11, n: 3.2, Kc: 1e12, K1c: 0, dkth: 0, sy: 300, su: 400, rneg: "kmax" };
  const pc = E.crackCase({ geometry: E.makeGeometry({ model: "constant", value: 1.12 }), material: pm, a0: 1, sigma_req: 1, a_max: 20, net_section: false });
  const k = 1.12 * 100 * Math.sqrt(Math.PI), exact = (Math.pow(20, -0.6) - 1) / (1e-11 * Math.pow(k, 3.2) * -0.6);
  const cp = E.constantAmplitude(100, 0);
  const lb = E.blockLife(pc, cp).life, lc = E.cycleLife(pc, cp).life;
  add("Paris closed-form integration (block and cycle solvers)", "DTDH 5.1", Math.abs(lb / exact - 1) < 1e-9 && Math.abs(lc / exact - 1) < 2e-3, `exact ${fmt(exact)}, block ${fmt(lb)}, cycle ${fmt(lc)}`);
  // centre crack vs Tada
  let dev = 0;
  for (let i = 1; i <= 14; i++) { const lam = 0.05 * i, tada = (1 - 0.025 * lam * lam + 0.06 * lam ** 4) * Math.sqrt(1 / Math.cos(Math.PI * lam / 2));
    dev = Math.max(dev, Math.abs(E.makeGeometry({ model: "center", W: 100 }).phases()[0].beta(lam * 50) / tada - 1)); }
  add("Centre crack Feddersen vs Tada accurate form, 2a/W ≤ 0.7", "DTDH 11.3, Tada", dev < 0.003, `max deviation ${(dev * 100).toFixed(3)}%`);
  // Bowie
  let gd = 0;
  for (let i = 0; i < 60; i++) { const ar = 0.01 * Math.pow(2000, i / 59); gd = Math.max(gd, Math.abs(E.galatolo(ar, 1) / E.f0B(1 / (1 + ar)) - 1)); }
  add("Single crack at hole: Galatolo fit vs DTDH f0(z), infinite plate", "DTDH Table 11.3.12", gd < 0.01 && Math.abs(E.f0B(1) - 3.365) < 1e-3, `max deviation ${(gd * 100).toFixed(2)}%; f0(1) = ${E.f0B(1).toFixed(4)}`);
  // NR
  const nr = E.nrSurface(0.01, 0.01, 100, 1e6);
  add("Newman-Raju semicircular surface crack, deepest point", "NASA TM-85793", Math.abs(nr - 1.04 / Math.sqrt(2.464)) < 1e-4, `F/√Q = ${nr.toFixed(4)}`);
  const r = 7.5, b = 30, c = 6;
  const lhs = 1 / Math.cos(Math.PI * (2 * r + 2 * c) / (4 * (b - c) + 4 * c)), rhs = 1 / Math.cos(Math.PI * (r + c) / (2 * b));
  add("TM-85793 eq. 62 reduces to Feddersen for two through cracks", "NASA TM-85793", Math.abs(lhs - rhs) < 1e-12, `${lhs.toFixed(6)} = ${rhs.toFixed(6)}`);

      continue;

    if (l.startsWith("# ")) out.push(`<h1>${inline(l.slice(2))}</h1>`);
    else if (l.startsWith("## ")) out.push(`<h2>${inline(l.slice(3))}</h2>`);
    else if (l.startsWith("- ")) { const items = []; while (i < lines.length && lines[i].startsWith("- ")) { items.push(`<li>${inline(lines[i].slice(2))}</li>`); i++; } out.push(`<ul>${items.join("")}</ul>`); continue; }

async function offerBlob(filename, blob) {
  if (state.downloads) {
    try { await state.downloads.save({ filename, data: blob }); toast(t("saved")); return; }
    catch (e) {
      if (e && e.code === "declined") return toast(t("cancelled"));
      if (e && e.code === "rate_limited") return toast("...");
      if (e && (e.code === "rejected_extension" || e.code === "extension_not_enabled")) return toast(e.message || "-");
    }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    toast(t("saved"));
  } catch (e) { toast(String(e.message || e)); }
}
async function offer(filename, data) {
  if (state.downloads) {
    try { await state.downloads.save({ filename, data }); toast(t("saved")); return; }
    catch (e) { if (e && e.code === "declined") { toast(t("cancelled")); return; } if (e && e.code === "rate_limited") { toast("…"); return; } }
  }
  if (!state.downloads) return offerBlob(filename, new Blob([data], { type: "text/plain;charset=utf-8" }));

  document.body.appendChild(m);

// Paste from a spreadsheet: a table with a header row goes through the file reader; plain rows are
// taken in the documented column order (11 or more cells: fastener, 3 to 6 cells: stress).
function gkParsePaste(text) {
  const lines = String(text).split(/\r?\n/).filter((l) => l.trim());
  if (!lines.length) return null;
  if (/F_byp_max|Kt_test|\bSmax\b/.test(lines.find((l) => !l.trim().startsWith("#")) || "")) return GK.fromText(text);
  const first = lines[0], sep = first.includes("\t") ? "\t" : ((first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ";" : ",");
  const fix = (v) => { v = v.trim(); if (sep !== ",") { const v2 = v.replace(/,/g, "."); if (v2 && Number.isFinite(Number(v2))) return v2; } return v; };
  const out = { params: {}, fastener: [], stress: [], lug: [] };
  for (const l of lines) {
    const cells = l.split(sep).map(fix);
    if (cells.length >= 11) { const r = {}; GK.FASTENER_COLS.forEach((k, i) => { if (i < cells.length && cells[i] !== "") r[k] = cells[i]; }); out.fastener.push(r); }
    else if (cells.length >= 7) { const r = {}; GK.LUG_COLS.forEach((k, i) => { if (i < cells.length && cells[i] !== "") r[k] = cells[i]; }); out.lug.push(r); }
    else if (cells.length >= 3) { const r = {}; GK.STRESS_COLS.forEach((k, i) => { if (i < cells.length && cells[i] !== "") r[k] = cells[i]; }); out.stress.push(r); }
    else return null;
  }
  return out;
}

function gkInit() {
  const v = $("#gkview");
  v.addEventListener("input", (ev) => {
    const el = ev.target;
    if (el.dataset.gkp) state.gk.sheet.params[el.dataset.gkp] = el.value.trim();
    else if (el.dataset.gk) { const [kind, i, k] = el.dataset.gk.split("."); state.gk.sheet[kind][+i][k] = el.value.trim(); }
    else return;
    gkPersist(); gkRun(); gkRenderResults();
  });
  v.addEventListener("change", (ev) => { if (ev.target.tagName === "SELECT") ev.target.dispatchEvent(new Event("input", { bubbles: true })); });
  v.addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    const S = state.gk.sheet;
    if (b.dataset.gkadd) { const k = b.dataset.gkadd, a = S[k] || (S[k] = []); a.push(k === "fastener" ? { shear: "single" } : {}); }
    else if (b.dataset.gkdel) S[b.dataset.gkdel].splice(+b.dataset.i, 1);
    else if (b.dataset.gkact === "example") state.gk.sheet = GK_EXAMPLE();
    else if (b.dataset.gkact === "clear") { S.fastener = []; S.stress = []; S.lug = []; }
    else if (b.dataset.gkpaste) {
      let o = null; try { o = gkParsePaste($("#gkpaste").value); } catch (e) { o = null; }
      if (!o || !(o.fastener.length || o.stress.length || o.lug.length)) { toast(t("gk_paste_err")); return; }
      if (b.dataset.gkpaste === "replace") { S.fastener = []; S.stress = []; S.lug = []; }
      S.lug = S.lug || [];
      S.fastener.push(...o.fastener); S.stress.push(...o.stress); S.lug.push(...o.lug); Object.assign(S.params, o.params);
      toast(`${o.fastener.length + o.stress.length + o.lug.length} ${t("gk_pasted")}`);
    } else if (b.dataset.gkdl === "xlsx") { if (state.gk.res) offerBlob("damtol_goodman.xlsx", DamtolExport.xlsxBlob(gkSheets(state.gk.res))); return; }
    else if (b.dataset.gkdl === "txt") { offer("damtol_goodman.csv", GK.toText(S)); return; }
    else return;
    gkPersist(); gkRenderAll();
  });
}

function showFatal(e) {
  const msg = String((e && (e.stack || e.message)) || e);
  const box = `<div class="note bad" style="margin:12px 16px;white-space:pre-wrap"><b>${esc(t("fatal_title"))}</b>\n${esc(msg.slice(0, 1200))}\n\n<button class="btn" type="button" id="fatal-reset">${esc(t("fatal_reset"))}</button></div>`;
  const sc = document.getElementById("scroll");
  if (sc) sc.innerHTML = box;
  if (document.body) document.body.dataset.pane = "input";     // 2.53.1: the message must be visible on a phone too
  if (window.__damtolBootError) window.__damtolBootError(msg.slice(0, 600));
  const rb = document.getElementById("runbtn");
  if (rb) rb.textContent = t("run");
  const fr = document.getElementById("fatal-reset");
  if (fr) fr.addEventListener("click", () => { forget(); location.reload(); });
}
function safeRenderAll() {
  try { renderAll(); return true; } catch (e) { console.error(e); }
  state.case = clone(DATA.example_case); state.adv = {}; state.open = { 1: true }; state.res = null; state.err = null; state.blocked = null;
  forget();
  try { renderAll(); toast(t("restore_reset")); return true; } catch (e) { console.error(e); showFatal(e); return false; }
}
function init() {
  state.gk.sheet = GK_EXAMPLE();
  const gkOk = gkRestore();
  try { state.pane = localStorage.getItem("damtol.pane") || "results"; state.gkPane = localStorage.getItem("damtol.gkpane") || "data"; }
  catch (e) { state.pane = "results"; state.gkPane = "data"; }
  if (!["input", "results"].includes(state.pane)) state.pane = "results";
  if (!["data", "res"].includes(state.gkPane)) state.gkPane = "data";
  if (PHONE.matches && INFO_CLOSED.gloss === undefined) INFO_CLOSED.gloss = true;     // the glossary starts closed on a phone
  const restored = restore();
  const drawn = safeRenderAll();
  if (drawn && !restored) toast(t("restore_reset"));
  const sc = $("#scroll");
  sc.addEventListener("input", onInput);
  sc.addEventListener("change", onInput);
  sc.addEventListener("click", onClick);
  sc.addEventListener("toggle", (ev) => { const d = ev.target; if (d.dataset && d.dataset.sec) state.open[d.dataset.sec] = d.open; }, true);
  $("#runbtn").addEventListener("click", run);
  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { state.case.mode = b.dataset.mode; changed(true); renderBar(); }));
  document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { state.lang = b.dataset.lang; persist(); renderAll(); if (state.view === "goodman") gkRenderAll(); }));
  $("#presets").addEventListener("change", (ev) => {
    const p = PRESETS[ev.target.value]; if (!p) return;
    state.case = p.make(); state.case.mode = state.case.mode || "study"; state.res = null; state.open = { 1: true };
    ev.target.value = ""; persist(); renderAll(); toast(t("preset_loaded")); run();
  });
  $("#btn-save").addEventListener("click", () => (state.view === "goodman" ? offer("damtol_goodman.csv", GK.toText(state.gk.sheet)) : download("case")));
  $("#btn-open").addEventListener("click", () => $("#file").click());
  $("#matfile").addEventListener("change", (ev) => {      // 2.50: local da/dN table, read in this browser only
    const f = ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { if (state.case.material && state.case.material.custom) matFileLoaded(f.name, rd.result); };
    rd.readAsText(f); ev.target.value = "";
  });
  $("#file").addEventListener("change", (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    if (state.view === "goodman") {
      rd.onload = () => {
        try { const o = gkValid(GK.fromText(String(rd.result).replace(/^\uFEFF/, ""))); if (!o || !(o.fastener.length || o.stress.length || o.lug.length)) throw new Error();
          state.gk.sheet = o; gkPersist(); gkRenderAll(); toast(`${t("gk_loaded")}: ${f.name}`);
        } catch (e) { toast(t("gk_open_err")); }
      };
      rd.readAsText(f); ev.target.value = ""; return;
    }
    rd.onload = () => {
      try { const o = parseCaseFile(rd.result); if (!o.spectrum || !o.geometry || !o.crack || !o.material) throw new Error();
        state.case = completeCase(o); state.res = null; state.open = { 1: true }; persist(); renderAll();
        const missing = Object.keys(DATA.neutral_case).filter((k) => !(k in o));
        run().then(() => toast(`${t(state.err || state.blocked ? "case_loaded_fail" : "case_loaded")}: ${f.name}`
          + (missing.length ? ` (${t("case_defaults")}: ${missing.join(", ")})` : "")));
      } catch (e) { toast(t("import_err")); }
    };
    rd.readAsText(f); ev.target.value = "";
  });
  $("#results").addEventListener("click", async (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.tab) {
      const pane = $("#results");
      if (pane && window.matchMedia("(min-width: 861px)").matches) pane.scrollTop = 0; state.tab = b.dataset.tab; renderResults(); phoneTabs(); }
    else if (b.dataset.sub) { state.sub = b.dataset.sub; renderResults(); }
    else if (b.dataset.tag) { state.tagOpen = state.tagOpen === b.dataset.tag ? null : b.dataset.tag; renderResults(); }
    else if (b.dataset.dl) download(b.dataset.dl);
    else if (b.dataset.fig) exportFigure(b.closest("figure"), b.dataset.fig);
    else if (b.dataset.advice) applyAdvice(+b.dataset.advice);
    else if (b.dataset.act === "waiver") {
      const txtv = ($("#waivertext").value || "").trim();
      if (!txtv) { $("#waivertext").focus(); return; }
      state.case.waivers = state.case.waivers || {}; state.case.waivers[b.dataset.id] = txtv; persist(); renderInputs(); run();
    } else if (b.dataset.act) {
      const act = b.dataset.act;
      b.innerHTML = `<span class="busy"></span>${esc(b.textContent)}`; b.disabled = true;
      await new Promise((r) => setTimeout(r, 30));
      try {
        if (act === "tornado") state.tornado = E.tornado(state.obj.case, state.obj.spectrum);
        if (act === "sweep") state.sweep = E.truncationSweep(state.obj.case, state.obj.spectrum);
        if (act === "selftest") state.selftest = selfTest();
      } catch (e) { toast(e.message); }
      renderResults();
    }
  });
  $("#scroll").addEventListener("click", async (ev) => {
    const q = ev.target.closest(".q"); if (q) { ev.preventDefault(); toast(q.title); return; }
    const b = ev.target.closest("[data-poe]"); if (!b) return;
    const g = state.case.geometry, tk = +((state.case.material || {}).thickness || 0), b0 = +g.spacing, As = +g.stringer_area, p = +g.rivet_pitch;
    if (!(tk > 0 && b0 > 0 && As > 0 && p > 0 && +g.W > 0)) { toast(t("poe_need")); return; }
    const d = +g.fastener_d || p / 4, Er = +g.E_ratio || 1, loc = g.crack_location || "midway";
    b.innerHTML = `<span class="busy"></span>${esc(t("poe_btn"))}`; b.disabled = true;
    await new Promise((r) => setTimeout(r, 30));
    try {
      const T = E.stiffenedTables({ W: +g.W, b: b0, t: tk, As, p, d, E_ratio: Er, location: loc });
      Object.assign(g, { beta_points: T.beta_points, lam_points: T.lam_points, L_points: T.L_points, crack_location: loc,
        table_source: `Poe (1971) NASA TR R-358 displacement compatibility, ${loc}, b ${b0} mm, t ${tk} mm, A_s ${As} mm2, p ${p} mm, d ${d} mm, E_s/E ${Er}` });
      persist(); renderAll(); run(); toast(`${t("poe_done")} (μ = ${fmt(T.mu, 3)})`);
    } catch (e) { toast(e.message); renderInputs(); }
  });
  $("#results").addEventListener("change", (ev) => {
    if (ev.target.dataset.showx) { state.showX = ev.target.checked; renderResults(); }
    if (ev.target.dataset.regall) { state.regAll = ev.target.checked; renderResults(); }
  });
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then((d) => { state.downloads = d; }).catch(() => { state.downloads = null; });
  }
  window.addEventListener("error", (ev) => { if (ev && ev.message) toast(`${t("js_error")}: ${ev.message}`); });
  window.addEventListener("unhandledrejection", (ev) => { const r = ev && ev.reason; toast(`${t("js_error")}: ${(r && r.message) || r}`); });
  gkInit();
  $("#btn-gk").addEventListener("click", () => gkShow(state.view !== "goodman"));
  $("#mnav").addEventListener("click", (ev) => { const b = ev.target.closest("[data-pane]"); if (b) goPane(b.dataset.pane); });
  $("#gkseg").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-gkpane]"); if (!b) return;
    state.gkPane = b.dataset.gkpane; try { localStorage.setItem("damtol.gkpane", state.gkPane); } catch (e) {}
    syncNav(); window.scrollTo(0, 0);
  });
  $("#mrun-btn").addEventListener("click", () => run());
  let lastView = null; try { lastView = localStorage.getItem("damtol.view"); } catch (e) {}
  if (lastView === "goodman") { try { gkShow(true); } catch (e) { console.error(e); state.gk.sheet = GK_EXAMPLE(); gkShow(true); } }
  if (!gkOk) toast(t("gk_restore"));
  if (drawn) run({ scroll: false });
}
document.addEventListener("DOMContentLoaded", () => {
  try { init(); window.__damtolStarted = true; const bm = document.getElementById("bootmsg"); if (bm && !bm.classList.contains("bad")) bm.hidden = true; }
  catch (e) { console.error(e); showFatal(e); }
});
})();
</script>

  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
